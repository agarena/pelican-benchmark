<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>鹈鹕骑自行车 · Three.js 全程序化 3D 场景</title>
<style>
  :root{
    --accent:#2fd3c4;
    --accent2:#ffb457;
    --glass:rgba(14,20,28,.55);
    --line:rgba(255,255,255,.14);
    --txt:#eef4f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1018;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt)}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;touch-action:none;cursor:grab}
  #stage canvas.dragging{cursor:grabbing}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:space-between}
  #ui.hidden{display:none}

  #topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px}
  .brand{display:flex;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 16px;border-radius:16px;max-width:60vw}
  .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 14px var(--accent);flex:none;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.7);opacity:.6}}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:.06em}
  .brand p{font-size:11px;opacity:.62;margin-top:3px;letter-spacing:.03em}
  #stats{display:flex;gap:10px}
  .stat{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-radius:14px;padding:9px 14px;text-align:center;min-width:78px}
  .stat span{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
  .stat.night span{color:var(--accent2)}
  .stat label{font-size:10px;opacity:.6;letter-spacing:.08em}

  #mid{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  #hint{font-size:11.5px;opacity:.5;letter-spacing:.04em;text-align:center;background:rgba(8,12,18,.4);
    padding:6px 14px;border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  footer{display:flex;justify-content:center;padding:14px 14px 20px}
  #dock{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;background:var(--glass);
    border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:10px 12px;border-radius:20px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .btn{pointer-events:auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
    color:var(--txt);font-size:13px;padding:9px 14px;border-radius:12px;cursor:pointer;letter-spacing:.03em;
    font-family:inherit;transition:.18s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px);border-color:rgba(255,255,255,.35)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.primary{background:linear-gradient(135deg,rgba(47,211,196,.28),rgba(47,211,196,.12));
    border-color:rgba(47,211,196,.5);color:#c9fff9}
  .btn.primary.paused{background:linear-gradient(135deg,rgba(255,180,87,.3),rgba(255,180,87,.1));
    border-color:rgba(255,180,87,.55);color:#ffe9cd}
  .btn.icon{width:38px;padding:9px 0;text-align:center;font-weight:700}
  .pill{display:flex;align-items:center;font-size:12.5px;padding:0 8px;opacity:.85;font-variant-numeric:tabular-nums}
  .grp{display:flex;align-items:center;gap:6px;border-left:1px solid rgba(255,255,255,.14);padding-left:9px}

  #loader{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 100% at 50% 0%,#12222e 0%,#080d13 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s}
  #loader.done{opacity:0;pointer-events:none}
  .ring{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader h2{font-size:17px;font-weight:600;letter-spacing:.14em}
  #loader p{font-size:12px;opacity:.55;letter-spacing:.08em;min-height:16px}
  .bar{width:230px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:105%}}

  #errlog{position:fixed;right:10px;bottom:10px;max-width:44vw;max-height:34vh;overflow:auto;z-index:99;
    display:none;background:rgba(60,8,8,.92);border:1px solid #ff6b6b;color:#ffd9d9;font:11px/1.5 Consolas,monospace;
    padding:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-all}
  #errlog.show{display:block}

  @media (max-width:760px){
    .brand h1{font-size:15px}.brand p{display:none}
    .stat{min-width:62px;padding:7px 9px}.stat span{font-size:16px}
    .btn{font-size:12px;padding:8px 10px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <div id="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>鹈鹕骑自行车</h1>
        <p>Three.js · 全程序化生成 · 无外部模型 / 无 SVG / 无 2D Canvas</p>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><span id="stSpeed">0.0</span><label>km/h</label></div>
      <div class="stat"><span id="stCad">0</span><label>踏频 rpm</label></div>
      <div class="stat"><span id="stDist">0</span><label>里程 m</label></div>

  <div id="mid"><div id="hint">拖拽旋转视角 · 滚轮缩放 · 点击鹈鹕互动 · ↑↓ 调速 · ←→ 转向 · 空格暂停 · C 换镜头 · T 换时间 · H 隐藏界面</div></div>

        <button class="btn icon" data-act="slower">−</button>

      <button class="btn" data-act="reset">↺ 重置</button>

</div>

<div id="loader">
  <div class="ring"></div>
  <h2>正在程序化生成世界</h2>
  <div class="bar"><i></i></div>
  <p id="status">初始化…</p>
</div>

<pre id="errlog"></pre>

<script>
  /* 全局错误捕获：任何运行时异常都会显示在右下角，便于诊断 */
  window.__errs = [];
  (function(){
    var box = document.getElementById('errlog');
    function show(msg){
      window.__errs.push(msg);
      box.textContent = window.__errs.slice(-8).join('\n\n');
      box.classList.add('show');
      var l = document.getElementById('status');
      if(l && !document.getElementById('loader').classList.contains('done')) l.textContent = '发生错误：' + msg;
    }
    window.addEventListener('error', function(e){
      show((e.message || 'error') + (e.filename ? ('\n@ ' + e.filename.split('/').pop() + ':' + e.lineno) : ''));
    });
    window.addEventListener('unhandledrejection', function(e){
      var r = e.reason;
      show('Promise: ' + (r && r.message ? r.message : String(r)));
    });
    /* 捕获 console.error（着色器编译失败、three.js 内部错误都会走这里） */
    var ce = console.error;
    console.error = function(){
      try{ show('console.error: ' + Array.prototype.slice.call(arguments).map(String).join(' ').slice(0,400)); }catch(e){}
      return ce.apply(console, arguments);
    };
  })();
</script>

<script type="module">
/* =====================================================================
   鹈鹕骑自行车 —— 单文件、全程序化 Three.js 场景
   所有模型（鹈鹕 / 自行车 / 环境）、动画、灯光、相机、交互均由代码生成
   ===================================================================== */

const statusEl = document.getElementById('status');
const loaderEl = document.getElementById('loader');
function setStatus(t){ if(statusEl) statusEl.textContent = t; }
const raf = () => new Promise(r => requestAnimationFrame(r));

/* ---------- 1. 加载 Three.js（多 CDN 容错） ---------- */
setStatus('正在从 CDN 加载 Three.js…');
let THREE = null, loadErr = null;
const CDNS = [
  '../vendor/three-0.161.0.module.js',
  'https://unpkg.com/three@0.161.0/build/three.module.js',
  'https://esm.sh/three@0.161.0',
  'https://jspm.dev/three@0.161.0'
];
for(const url of CDNS){
  try{
    const mod = await import(url);
    if(mod && mod.WebGLRenderer){ THREE = mod; break; }
  }catch(err){ loadErr = err; }
}
if(!THREE){
  setStatus('无法加载 Three.js（需要联网）。' + (loadErr ? String(loadErr.message || loadErr) : ''));
  throw new Error('Three.js CDN 加载失败');
}
await raf();

/* ---------- 2. 工具 ---------- */
const V3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const rand = (a,b) => b===undefined ? Math.random()*a : a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const damp  = (a,b,l,dt) => a + (b-a)*(1-Math.exp(-l*dt));
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _v4 = V3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const FWD = V3(0,0,-1), UP = V3(0,1,0);

function tubeBetween(a, b, rA, rB, mat, seg=10){
  const dir = V3().subVectors(b,a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(rB===undefined?rA:rB, rA, len, seg, 1, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.castShadow = true;
  return mesh;
}

/* 把一个 Group（根节点位于原点）按材质颜色烘焙成单个带顶点色的 Mesh —— 大幅减少 draw call */
function mergeToMesh(root, material){
  root.updateMatrixWorld(true);
  const pos = [], nor = [], uv = [], col = [];
  const c = new THREE.Color();
  root.traverse(o => {
    if(!o.isMesh) return;
    const g0 = o.geometry;
    const g = g0.index ? g0.toNonIndexed() : g0.clone();
    g.applyMatrix4(o.matrixWorld);
    const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    c.copy(m.color);
    for(let i=0;i<P.count;i++){
      pos.push(P.getX(i), P.getY(i), P.getZ(i));
      if(N) nor.push(N.getX(i), N.getY(i), N.getZ(i)); else nor.push(0,1,0);
      if(U) uv.push(U.getX(i), U.getY(i)); else uv.push(0,0);
      col.push(c.r, c.g, c.b);
    }
    g.dispose();
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

/* 有机噪声球（树冠 / 灌木 / 远山的基元） */
function makeBlobGeo(w,h,amp){
  const g = new THREE.SphereGeometry(1, w, h);
  const p = g.attributes.position, v = V3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n = v.clone().normalize();
    const b = Math.sin(n.x*3.1+1.7)*Math.sin(n.y*2.6+0.4)
            + 0.7*Math.sin(n.z*4.2+2.3)*Math.sin(n.x*2.4+0.9)
            + 0.5*Math.sin(n.y*5.1+3.1)*Math.sin(n.z*3.7+1.2);
    v.copy(n).multiplyScalar(1 + amp*b/2.2);
    if(v.y < -0.7) v.y = -0.7 - (v.y+0.7)*0.3;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

/* 渐变锥形管（鹈鹕脖子等）——自定义 BufferGeometry */
function taperedTube(curve, radiusFn, tubular, radial){
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], nor = [], uv = [], idx = [];
  for(let i=0;i<=tubular;i++){
    const u = i/tubular;
    const P = curve.getPointAt(u);
    const N = frames.normals[i], B = frames.binormals[i];
    const r = radiusFn(u);
    for(let j=0;j<=radial;j++){
      const v = j/radial * Math.PI*2;
      const sn = Math.sin(v), cs = -Math.cos(v);
      const nx = cs*N.x + sn*B.x, ny = cs*N.y + sn*B.y, nz = cs*N.z + sn*B.z;
      pos.push(P.x + r*nx, P.y + r*ny, P.z + r*nz);
      nor.push(nx, ny, nz);
      uv.push(u, j/radial);
    }
  }
  for(let i=0;i<tubular;i++) for(let j=0;j<radial;j++){
    const a = (radial+1)*i + j, b = (radial+1)*(i+1) + j;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  return g;
}

/* 程序化纹理（DataTexture，非 2D Canvas） */
function noiseTexture(size, base, variance, blotch){
  const data = new Uint8Array(size*size*4);
  const grid = 16, cells = new Float32Array(grid*grid);
  for(let i=0;i<cells.length;i++) cells[i] = Math.random();
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    let b = 0;
    if(blotch){
      const gx = x/size*grid, gy = y/size*grid;
      const x0 = Math.floor(gx)%grid, y0 = Math.floor(gy)%grid;
      const x1 = (x0+1)%grid, y1 = (y0+1)%grid;
      const fx = gx-Math.floor(gx), fy = gy-Math.floor(gy);
      const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
      const a = cells[y0*grid+x0], bb = cells[y0*grid+x1], cc = cells[y1*grid+x0], dd = cells[y1*grid+x1];
      b = ((a+(bb-a)*sx) + ((cc+(dd-cc)*sx) - (a+(bb-a)*sx))*sy - 0.5) * 1.4;
    }
    const g = (Math.random()-0.5) + b;
    const i = (y*size+x)*4;
    data[i]   = clamp(base[0] + g*variance, 0, 255);
    data[i+1] = clamp(base[1] + g*variance, 0, 255);
    data[i+2] = clamp(base[2] + g*variance*0.8, 0, 255);
    data[i+3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}
/* 径向光晕纹理（用于灯罩辉光 / 萤火虫） */
function glowTexture(size, power){
  const data = new Uint8Array(size*size*4);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const dx = (x+0.5)/size*2-1, dy = (y+0.5)/size*2-1;
    const d = Math.min(1, Math.sqrt(dx*dx+dy*dy));
    const a = Math.pow(Math.max(0, 1-d), power);
    const i = (y*size+x)*4;
    data[i]=255; data[i+1]=255; data[i+2]=255; data[i+3]=a*255;
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/* ---------- 3. 渲染器 / 场景 / 相机 ---------- */
setStatus('初始化渲染器…');
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
}catch(e){
  setStatus('当前浏览器不支持 WebGL：' + e.message);
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9e6ff, 42, 195);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(5.4, 2.7, 6.8);

await raf();

/* ---------- 4. 天空（着色器程序化渐变 + 太阳 + 星空） ---------- */
setStatus('绘制程序化天空…');
const skyU = {
  uTop:   {value:new THREE.Color(0x2c68c8)},
  uMid:   {value:new THREE.Color(0x8cc3ee)},
  uBot:   {value:new THREE.Color(0xdcf2ff)},
  uHaze:  {value:new THREE.Color(0xdcf2ff)},
  uSunDir:{value:V3(-0.5,0.8,0.35).normalize()},
  uSunColor:{value:new THREE.Color(0xfff3dd)},
  uSunI:  {value:0.9},
  uNight: {value:0.0},
  uTime:  {value:0.0}
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite:false, fog:false,
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uTop,uMid,uBot,uHaze,uSunDir,uSunColor;
    uniform float uSunI,uNight,uTime;
    varying vec3 vDir;
    float hash13(vec3 p){
      p = fract(p * 0.1031);
      p += dot(p, p.zyx + 31.32);
      return fract((p.x + p.y) * p.z);
    }
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = mix(uBot, uMid, smoothstep(-0.10, 0.24, h));
      col = mix(col, uTop, smoothstep(0.16, 0.78, h));
      float hazeBand = 1.0 - smoothstep(-0.01, 0.22, abs(h));
      col = mix(col, uHaze, hazeBand * 0.55);
      float sd = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunColor * (pow(sd, 900.0)*3.0 + pow(sd, 60.0)*0.5 + pow(sd, 6.0)*0.15) * uSunI;
      if(uNight > 0.001){
        vec3 g = floor(d * 300.0);
        float s = hash13(g);
        float star = smoothstep(0.9965, 1.0, s);
        float tw = 0.55 + 0.45*sin(uTime*2.5 + s*97.0);
        col += vec3(0.85,0.9,1.0) * star * tw * uNight * smoothstep(0.0, 0.25, h);
      }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 20), skyMat);
sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

/* 环境反射贴图（从天空烘焙，让车架/轮圈拥有真实反射） */
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function bakeEnv(){
  const es = new THREE.Scene();
  es.add(sky.clone());
  const rt = pmrem.fromScene(es, 0.03, 0.1, 1200);
  if(envRT) envRT.dispose();
  envRT = rt;
  scene.environment = rt.texture;
}

/* ---------- 5. 材质库 ---------- */
setStatus('调制材质…');
const envM = (m) => m;
const M = {
  body:   new THREE.MeshStandardMaterial({color:0xf7f5ef, roughness:0.66, metalness:0.0, envMapIntensity:0.5}),

function applyPreset(dt){
  const k = 1-Math.exp(-1.7*dt);
  for(const key of ['top','mid','bot','haze','sunColor','hemiSky','hemiGnd','fillC','fog'])
    cur[key].lerp(tgt[key], k);
  for(const key of ['sunI','hemiI','fillI','fogNear','fogFar','night','exposure','lamp'])
    cur[key] = damp(cur[key], tgt[key], 1.7, dt);
  cur.sunDir.lerp(tgt.sunDir, k).normalize();

  skyU.uTop.value.copy(cur.top);  skyU.uMid.value.copy(cur.mid);
  skyU.uBot.value.copy(cur.bot);  skyU.uHaze.value.copy(cur.haze);
  skyU.uSunDir.value.copy(cur.sunDir);
  skyU.uSunColor.value.copy(cur.sunColor);
  skyU.uSunI.value = clamp(cur.sunI*0.4, 0, 1.4);
  skyU.uNight.value = cur.night;

  scene.fog.color.copy(cur.fog);
  scene.fog.near = cur.fogNear; scene.fog.far = cur.fogFar;
  renderer.toneMappingExposure = cur.exposure;

  sun.color.copy(cur.sunColor); sun.intensity = cur.sunI;
  sun.position.copy(cur.sunDir).multiplyScalar(55);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity = cur.hemiI;
  fill.color.copy(cur.fillC); fill.intensity = cur.fillI;
}

function mergeGeoms(geos){
  let total = 0;
  const nl = geos.map(g => { const n = g.index ? g.index.count : g.attributes.position.count; total += n; return n; });
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), uv = new Float32Array(total*2);
  let o = 0;
  geos.forEach((g0,gi) => {
    const g = g0.index ? g0.toNonIndexed() : g0;
    const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
    for(let i=0;i<P.count;i++){
      pos[(o+i)*3]=P.getX(i); pos[(o+i)*3+1]=P.getY(i); pos[(o+i)*3+2]=P.getZ(i);
      nor[(o+i)*3]=N.getX(i); nor[(o+i)*3+1]=N.getY(i); nor[(o+i)*3+2]=N.getZ(i);
      uv[(o+i)*2]=U.getX(i);  uv[(o+i)*2+1]=U.getY(i);
    }
    o += P.count;
    if(g !== g0) g.dispose(); g0.dispose();
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  geo.computeBoundingSphere();
  return geo;
}

/* --- 链条：闭合曲线 + 沿线滚动的链节 --- */
const chainCurve = (() => {
  const y1 = BB.y, z1 = BB.z, y2 = RA.y, z2 = RA.z;
  const dy = y2-y1, dz = z2-z1;
  const dlen = Math.hypot(dy,dz);
  const beta = Math.acos(clamp((RING_R-COG_R)/dlen, -1, 1));
  const uy = dy/dlen, uz = dz/dlen;
  const rot = (y,z,a) => [y*Math.cos(a)-z*Math.sin(a), y*Math.sin(a)+z*Math.cos(a)];
  const nUp = rot(uy,uz,-beta), nLo = rot(uy,uz,beta);
  /* 切点（按“链环流动顺序”排列）：上切点(链轮) → 链轮包络 → 下切点 → 直线 → 飞轮… */
  const P1b = [y1+RING_R*nUp[0], z1+RING_R*nUp[1]];   /* 链轮·上切点 */
  const P1a = [y1+RING_R*nLo[0], z1+RING_R*nLo[1]];   /* 链轮·下切点 */
  const P2a = [y2+COG_R*nLo[0],  z2+COG_R*nLo[1]];    /* 飞轮·下切点 */
  const P2b = [y2+COG_R*nUp[0],  z2+COG_R*nUp[1]];    /* 飞轮·上切点 */
  const X = 0.125;
  const pts = [];
  const angOf = (p,c) => Math.atan2(p[0]-c[0], p[1]-c[1]);
  const c1 = [y1,z1], c2 = [y2,z2];
  /* 链轮包络：从上切点越过顶部 → 前方 → 底部 → 下切点（约 211°） */
  const a1 = angOf(P1b,c1);
  const sweep1 = 3.684;
  for(let i=0;i<=26;i++){
    const a = a1 + sweep1*i/26;
    pts.push(V3(X, y1+RING_R*Math.cos(a), z1+RING_R*Math.sin(a)));
  }
  /* 下方直线 → 飞轮下切点 */
  for(let i=1;i<=7;i++){
    const t = i/7;
    pts.push(V3(X, P1a[0]+(P2a[0]-P1a[0])*t, P1a[1]+(P2a[1]-P1a[1])*t));
  }
  /* 飞轮包络：下切点 → 后方 → 上切点（约 149°） */
  const a2 = angOf(P2a,c2);
  const sweep2 = 2.599;
  for(let i=1;i<=16;i++){
    const a = a2 + sweep2*i/16;
    pts.push(V3(X, y2+COG_R*Math.cos(a), z2+COG_R*Math.sin(a)));
  }
  /* 上方直线回到链轮 */
  for(let i=1;i<=7;i++){
    const t = i/7;
    pts.push(V3(X, P2b[0]+(P1b[0]-P2b[0])*t, P2b[1]+(P1b[1]-P2b[1])*t));
  }
  const c = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  c.arcLengthDivisions = 800;
  return c;
})();

  g.scale(widen, 1, flatten);
  g.translate(0, 0, -len/2);
  return g;
}

const _hip = V3(), _tgt = V3(), _n = V3(), _perp = V3(), _knee = V3(), _tcl = V3();
function solveLeg(leg, targetLocal){
  _hip.copy(leg.hipLocal);
  _tgt.copy(targetLocal);
  _n.subVectors(_tgt, _hip);
  let dist = _n.length();
  const maxD = L1+L2-0.015;
  if(dist > maxD){ _tgt.copy(_hip).addScaledVector(_n.normalize(), maxD); dist = maxD; _n.normalize(); }
  else _n.divideScalar(dist || 1);
  _perp.set(0,0,1);
  _perp.addScaledVector(_n, -_perp.dot(_n));
  if(_perp.lengthSq() < 1e-6){ _perp.set(1,0,0).addScaledVector(_n, -_n.x); }
  _perp.normalize();
  const cosA = clamp((L1*L1 + dist*dist - L2*L2)/(2*L1*dist), -1, 1);
  const sinA = Math.sqrt(Math.max(0, 1-cosA*cosA));
  _knee.copy(_n).multiplyScalar(cosA).addScaledVector(_perp, sinA).normalize();
  leg.thigh.quaternion.setFromUnitVectors(FWD, _knee);

  _tcl.copy(_hip).addScaledVector(_knee, L1);
  _tcl.subVectors(_tgt, _tcl).normalize();
  _q1.copy(leg.thigh.quaternion).invert();
  _tcl.applyQuaternion(_q1);
  leg.shin.quaternion.setFromUnitVectors(FWD, _tcl);
}

  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  cv.setPointerCapture(e.pointerId);
  if(pointers.size === 1){
    dragging = true; lastX = downX = e.clientX; lastY = downY = e.clientY; moved = 0;
    cv.classList.add('dragging');
  }else if(pointers.size === 2){
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    dragging = false;
  }
});

  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 2){
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if(pinchDist > 0){
      enterOrbit();
      rig.radius = clamp(rig.radius * pinchDist/Math.max(1,d), 2.4, 18);
    }
    pinchDist = d;
    return;
  }
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  if(moved > 6){
    enterOrbit();
    rig.azim -= dx*0.0052;
    rig.polar = clamp(rig.polar - dy*0.0045, 0.2, 1.52);
  }
});

  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchDist = 0;
  if(pointers.size === 0){

const SHOTS = {
  chase: {p:V3(0.9, 2.05, 6.4),  l:V3(0, 1.5, -0.7), fov:48},
  side:  {p:V3(4.9, 1.62, 0.45), l:V3(0, 1.42, 0),   fov:44},
  front: {p:V3(-1.25, 1.85, -5.7),l:V3(0, 1.66, 0.3), fov:42},
  wheel: {p:V3(1.6, 0.74, 1.95), l:V3(0.05, 0.5, 0.15), fov:40},
  high:  {p:V3(3.3, 4.5, 4.8),   l:V3(0, 1.0, 0),    fov:46}
};
const CINEMA_SEQ = ['chase','side','front','wheel','high'];
function updateCamera(dt, t){
  const mode = CAM_MODES[state.camIdx].id;
  const p = V3(), l = V3();
  let fov = 46, lam = 2.4;

  if(mode === 'orbit'){
    const sp = Math.sin(rig.polar), cp = Math.cos(rig.polar);
    p.set(rig.target.x + rig.radius*sp*Math.sin(rig.azim),
          rig.target.y + rig.radius*cp,
          rig.target.z + rig.radius*sp*Math.cos(rig.azim));
    l.copy(rig.target);
    fov = 46; lam = 9;
  }else if(mode === 'cinema'){
    state.cinemaT += dt;
    const shot = SHOTS[CINEMA_SEQ[Math.floor(state.cinemaT/9.5) % CINEMA_SEQ.length]];
    const sway = 0.22*Math.sin(t*0.13);
    const off = V3().subVectors(shot.p, shot.l);
    off.applyAxisAngle(UP, sway);
    p.copy(shot.l).add(off);
    l.copy(shot.l);
    fov = shot.fov;
  }else{
    const shot = SHOTS[mode];
    p.copy(shot.p); l.copy(shot.l);
    if(mode === 'chase'){ p.x += state.laneX*0.6 + 0.35*Math.sin(t*0.4); l.x = state.laneX*0.5; }
    if(mode === 'front'){ p.x += 0.25*Math.sin(t*0.35); }
    if(mode === 'side'){ p.z += 0.3*Math.sin(t*0.3); }
    p.y += 0.03*Math.sin(state.distance*3.7);
    fov = shot.fov;
  }
  camPosS.lerp(p, 1-Math.exp(-lam*dt));
  camLookS.lerp(l, 1-Math.exp(-lam*dt));
  camera.position.copy(camPosS);
  camera.position.y = Math.max(camera.position.y, 0.32);
  camera.lookAt(camLookS);
  const nf = damp(camera.fov, fov, 3.5, dt);
  if(Math.abs(nf-camera.fov) > 0.01){ camera.fov = nf; camera.updateProjectionMatrix(); }
}

setStatus('启动渲染…');
const clock = new THREE.Clock();
let elapsed = 0, fpsFrames = 0, fpsTime = 0, hudTime = 0;
const stSpeed = document.getElementById('stSpeed');
const stCad = document.getElementById('stCad');
const stDist = document.getElementById('stDist');
const stFps = document.getElementById('stFps');
const dashObj = window.__dashes, fenceObj = window.__fence;

const pedalWorldR = V3(), pedalWorldL = V3(), tgtLocal = V3();

function step(dt){
  elapsed += dt;

  /* --- 输入与速度 --- */
  if(keys.has('ArrowLeft'))  state.steerT = clamp(state.steerT + dt*0.9, -0.24, 0.24);
  else if(keys.has('ArrowRight')) state.steerT = clamp(state.steerT - dt*0.9, -0.24, 0.24);
  else state.steerT = damp(state.steerT, 0, 2.2, dt);

  const target = state.paused ? 0 : state.userSpeed;
  state.speed = damp(state.speed, target, state.paused ? 1.1 : 1.6, dt);
  if(state.speed < 0.015) state.speed = 0;
  const dd = state.speed * dt;
  state.distance += dd;

  /* 自动小幅蜿蜒 + 转向输入 */
  const autoWeave = state.speed > 0.5 ? 0.085*Math.sin(elapsed*0.5) : 0;
  state.steer = damp(state.steer, state.steerT + autoWeave, 4, dt);
  state.laneX = clamp(state.laneX - Math.sin(state.steer)*dd*0.55 +
    (0.34*Math.sin(elapsed*0.21) - state.laneX)*dt*0.35, -1.25, 1.25);

  const roll = -state.steer*0.75;
  bikeRoot.position.x = state.laneX;
  bikeRoot.rotation.y = state.steer;
  bikeRoot.rotation.z = roll;
  /* 前叉 / 车把 / 前轮绕头管轴随转向偏转 */
  _q1.copy(qAxis).multiply(_q2.setFromAxisAngle(UP, state.steer*0.85));
  steerGrp.quaternion.copy(_q1);

  /* --- 轮 / 曲柄 / 链条 / 地面滚动（全部由行进距离驱动，天然协调） --- */
  const wheelAng = -state.distance / RW;
  rearW.spinner.rotation.x = wheelAng;
  frontW.spinner.rotation.x = wheelAng;
  const crankAng = -state.distance / (RW*GEAR);
  crankGrp.rotation.x = crankAng;
  pedalPivR.rotation.x = -crankAng;
  pedalPivL.rotation.x = -crankAng;

  const linkPhase = (state.distance*GEAR/RING_R) / chainPathLen;
  {
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = V3(1,1,1);
    for(let i=0;i<LINKS;i++){
      const u = ((i/LINKS + linkPhase) % 1 + 1) % 1;
      const pt = chainCurve.getPointAt(u);
      const tg = chainCurve.getTangentAt(u);
      q.setFromUnitVectors(V3(0,0,1), tg);
      m.compose(pt, q, s);
      linkMesh.setMatrixAt(i, m);
    }
    linkMesh.instanceMatrix.needsUpdate = true;
  }

  roadTex.offset.y += dd/(520/420);
  grassTex.offset.y += dd/(560/84);
  ao.position.x = state.laneX;
  dashObj.position.z = ((state.distance % DASH_STEP) + DASH_STEP) % DASH_STEP;
  fenceObj.position.z = ((state.distance % 2) + 2) % 2;

  for(const r of rollers){
    r.obj.position.z += dd;
    if(r.obj.position.z > Z_NEAR){
      r.obj.position.z -= SPAN;
      if(r.respawn) r.respawn(r.obj);
    }
  }

  /* --- 鹈鹕身体动画 --- */
  const riding = state.speed > 0.4;
  const ph = crankAng;                          /* 踏板相位（负向累加） */
  const speedN = clamp(state.speed/8, 0, 1);

  pelican.position.set(0, PIVOT.y + 0.016*Math.sin(2*ph) + 0.004*Math.sin(elapsed*1.6), PIVOT.z);
  const wobble = riding ? 0 : 0.075*Math.sin(elapsed*1.25) + 0.03*Math.sin(elapsed*2.7);
  pelican.rotation.z = -roll*0.42 + (riding ? 0.045*Math.sin(ph) : wobble*0.6);
  pelican.rotation.x = -(0.045 + 0.075*speedN) + 0.02*Math.sin(2*ph+0.9) + state.clickKick*0.06;
  pelican.rotation.y = state.clickKick*0.05;

  /* 脖子 / 头 */
  const neckSway = riding ? 0.03*Math.sin(elapsed*1.1) : 0.05*Math.sin(elapsed*0.8);
  neckGrp.rotation.x = neckSway - 0.06*speedN;
  neckGrp.rotation.z = 0.025*Math.sin(elapsed*0.73);

  state.lookT += dt;
  let yawT, pitchT;
  _v1.set(0,0,-1).applyQuaternion(camera.quaternion);   /* 相机朝向 */
  _v2.copy(camera.position).sub(pelican.getWorldPosition(_v3));
  const camAhead = _v2.z < -0.6;                        /* 相机在鹈鹕正前方 */
  if(camAhead && state.camIdx !== 4){
    _v2.normalize();
    yawT = clamp(Math.atan2(-_v2.x, -_v2.z), -0.5, 0.5);
    pitchT = clamp(Math.asin(clamp(_v2.y,-1,1))*0.5, -0.25, 0.2) - 0.06;
  }else{
    yawT = 0.28*Math.sin(state.lookT*0.27) + 0.14*Math.sin(state.lookT*0.11+2.1);
    pitchT = -0.05 + 0.06*Math.sin(state.lookT*0.4);
    if(!riding) pitchT += 0.18*Math.max(0, Math.sin(state.lookT*0.5));  /* 停下时低头看看脚踏 */
  }
  head.rotation.y = damp(head.rotation.y, yawT, 2.6, dt);
  head.rotation.x = damp(head.rotation.x, pitchT, 2.6, dt);
  head.rotation.z = damp(head.rotation.z, -yawT*0.25, 2.6, dt);

  /* 眨眼 */
  state.blinkT -= dt;
  if(state.blinkT <= 0){ state.blinkPhase = 0.26; state.blinkT = rand(2.4, 6); }
  if(state.blinkPhase > 0){
    state.blinkPhase -= dt;
    const b = Math.sin(clamp(1-state.blinkPhase/0.26,0,1)*Math.PI);
    for(const lid of lids) lid.rotation.x = -0.35 + b*1.85;
  }

  /* 喉囊抖动 */
  const jig = riding ? Math.sin(2*ph - 0.7) : Math.sin(elapsed*2.2)*0.4;
  pouch.rotation.x = jig*0.07;
  pouch.scale.set(1 + 0.045*jig*Math.abs(speedN-0.2), 1 + 0.06*jig, 1);
  const gulp = Math.max(0, Math.sin(elapsed*0.55)-0.93)*6 + state.clickKick*0.5;
  pouch.scale.x += gulp*0.1; pouch.scale.y += gulp*0.14;

  /* 翅膀：滑行时轻柔维持平衡，间歇性振翅，停下时拍翅保持平衡 */
  state.flapT = state.flapT >= 0 ? state.flapT + dt : -1;
  if(state.flapT > 1.7){ state.flapT = -1; state.flapTimer = riding ? rand(5,10) : rand(2.6,4.5); }
  if(state.flapT < 0){
    state.flapTimer -= dt;
    if(state.flapTimer <= 0) state.flapT = 0;
  }
  let flapRaise = 0, spread = 0;
  if(state.flapT >= 0){
    const pr = state.flapT/1.7;
    const beat = Math.sin(pr*Math.PI*3.4) * (1-0.35*pr);
    flapRaise = beat*0.62;
    spread = Math.max(0, beat)*0.7;
  }
  for(const w of wings){
    const idle = riding
      ? 0.30 + 0.05*Math.sin(2*ph + 0.7) + 0.02*Math.sin(elapsed*1.9)
      : 0.44 + 0.07*Math.sin(elapsed*1.6);
    w.grp.rotation.z = w.s*(idle + flapRaise + state.clickKick*0.35);
    w.grp.rotation.y = -w.s*(0.2 - spread*0.18);
    w.grp.rotation.x = -0.1 + flapRaise*0.35;
    w.feathers.forEach((f,i) => { f.rotation.y = w.s*(-0.5 + i*0.19)*(1 + spread*0.55); });
  }
  /* 尾羽 */
  tailGrp.rotation.z = 0.08*Math.sin(elapsed*1.4) + (riding?0.05*Math.sin(2*ph+2):0);

  /* --- 腿部 IK：脚锁定在踏板上 --- */
  bikeRoot.updateMatrixWorld(true);
  pedalPivR.getWorldPosition(pedalWorldR);
  pedalPivL.getWorldPosition(pedalWorldL);
  for(const [leg, pw] of [[legR, pedalWorldR],[legL, pedalWorldL]]){
    tgtLocal.copy(pw); tgtLocal.y += 0.07;
    pelican.worldToLocal(tgtLocal);
    solveLeg(leg, tgtLocal);
  }
  pelican.updateMatrixWorld(true);
  bikeRoot.getWorldQuaternion(_q3);
  for(const leg of legs){
    leg.shin.getWorldQuaternion(_q1);
    _q2.copy(_q1).invert().multiply(_q3);
    leg.foot.quaternion.copy(_q2);
    leg.foot.rotateX(0.10);
  }

  /* --- 围巾 Verlet --- */
  {
    const windZ = 3.2 + state.speed*2.4;
    const gust = 0.9 + 0.6*Math.sin(elapsed*3.1);
    for(let i=1;i<SCARF_N;i++){
      const p = sPts[i], pv = sPrev[i];
      const vx = (p.x-pv.x)*0.965, vy = (p.y-pv.y)*0.965, vz = (p.z-pv.z)*0.965;
      pv.copy(p);
      p.x += vx + (0.7*gust*Math.sin(elapsed*4+i))*dt*dt;
      p.y += vy + (-6.5 + windZ*0.14)*dt*dt;
      p.z += vz + windZ*dt*dt;
    }
    sPts[0].copy(scarfPin); sPrev[0].copy(scarfPin);
    for(let it=0; it<3; it++){
      for(let i=1;i<SCARF_N;i++){
        _v1.subVectors(sPts[i], sPts[i-1]);
        const d = _v1.length() || 1e-5;
        sPts[i].addScaledVector(_v1, -(d-SEG)/d);
      }
      sPts[0].copy(scarfPin);
    }
    const pa = scarfGeo.attributes.position;
    for(let i=0;i<SCARF_N;i++){
      const p = sPts[i];
      if(i<SCARF_N-1) _v1.subVectors(sPts[i+1], p); else _v1.subVectors(p, sPts[i-1]);
      _v1.normalize();
      _v2.crossVectors(_v1, UP);
      if(_v2.lengthSq() < 1e-5) _v2.crossVectors(_v1, V3(1,0,0));
      _v2.normalize();
      const w = 0.052*(1 - 0.5*i/(SCARF_N-1));
      pa.setXYZ(i*2,   p.x-_v2.x*w, p.y-_v2.y*w, p.z-_v2.z*w);
      pa.setXYZ(i*2+1, p.x+_v2.x*w, p.y+_v2.y*w, p.z+_v2.z*w);
    }
    pa.needsUpdate = true;
    scarfGeo.computeVertexNormals();
    scarfGeo.computeBoundingSphere();   /* 位置每帧变化，需刷新包围球避免视锥剔除出错 */
  }

  /* --- 环境小动画 --- */
  for(const b of birds){
    const u = b.userData;
    const flap = Math.sin(elapsed*7 + u.ph)*0.55;
    u.wl.rotation.z = flap; u.wr.rotation.z = -flap;
    b.position.x += u.vx*dt;
    b.position.z += dd*0.85;
    b.rotation.y = u.vx > 0 ? -Math.PI/2+0.3 : Math.PI/2-0.3;
  }
  for(const g of bflies){
    const u = g.userData;
    const f = Math.sin(elapsed*17 + u.ph)*0.9;
    u.pr.rotation.y = -Math.abs(f); u.pl.rotation.y = Math.abs(f);
    g.position.x = u.bx + Math.sin(elapsed*0.8+u.ph)*1.4;
    g.position.y = u.by + Math.sin(elapsed*1.9+u.ph)*0.3;
    g.position.z += dd;
    g.rotation.y = Math.sin(elapsed*0.9+u.ph)*0.7;
  }
  /* 萤火虫 */
  {
    const p = ffGeo.attributes.position;
    for(let i=0;i<ffCount;i++){
      const b = ffBase[i];
      let z = b.z + ((state.distance) % SPAN);
      if(z > Z_NEAR) z -= SPAN;
      p.setX(i, b.x + Math.sin(elapsed*0.9+b.ph)*0.5);
      p.setY(i, b.y + Math.sin(elapsed*1.7+b.ph*2)*0.28);
      p.setZ(i, z);
    }
    p.needsUpdate = true;
    ffMat.opacity = cur.night*0.9;
  }
  /* 尘土 */
  for(const d of dust){
    if(state.speed > 0.6){
      d.life += dt;
      if(d.life >= d.dur || d.life < 0){
        d.life = 0;
        d.m.visible = true;
        d.m.position.set(state.laneX + rand(-0.18,0.3), 0.05, 0.76 + rand(-0.1,0.1));
        d.vel.set(rand(-0.35,0.5), rand(0.35,0.7), state.speed*0.4 + rand(0.5,1.4));
      }
      d.m.position.addScaledVector(d.vel, dt);
      d.vel.y = Math.max(0.05, d.vel.y - 0.4*dt);
      const pr = d.life/d.dur;
      const s = 0.05 + pr*0.24;
      d.m.scale.setScalar(s);
      d.mat.opacity = 0.4*(1-pr);
      d.m.visible = true;
    }else{
      d.life = -1; d.m.visible = false;
    }
  }

  /* --- 时间预设 / 灯光 --- */
  applyPreset(dt);
  M.lampGlass.emissiveIntensity = cur.lamp*2.4;
  M.tailLight.emissiveIntensity = cur.lamp*2.0;
  M.headLens.emissiveIntensity = cur.lamp*3.2;
  M.beam.opacity = cur.lamp*0.11;
  spot.intensity = cur.lamp*95;
  for(const l of lamps) l.userData.glow.material.opacity = cur.lamp*0.75;
  M.cloud.emissiveIntensity = 0.24*(1-cur.night*0.85);
  skyU.uTime.value = elapsed;

  updateCamera(dt, elapsed);
}

/* 首帧 */
applyPreset(0.016);
step(0.016);
renderer.render(scene, camera);
loaderEl.classList.add('done');
setStatus('就绪');

let firstFrame = true;

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  renderer.render(scene, camera);
  if(firstFrame){ firstFrame = false; setTimeout(()=>loaderEl.style.display='none', 900); }

  fpsFrames++; fpsTime += dt; hudTime += dt;
  if(hudTime > 0.22){
    hudTime = 0;
    stSpeed.textContent = (state.speed*3.6).toFixed(1);
    stCad.textContent = Math.round(Math.abs(state.speed)/(RW*GEAR)/(Math.PI*2)*60);
    stDist.textContent = Math.round(state.distance);
    if(fpsTime > 0.5){
      stFps.textContent = Math.round(fpsFrames/fpsTime);
      fpsFrames = 0; fpsTime = 0;
    }
    document.querySelectorAll('.stat').forEach(el => el.classList.toggle('night', cur.night > 0.5));
  }
}
loop();
</script>
</body>
