<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕 · Three.js 程序化场景</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e13;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .card { position:fixed; color:#f2f4f8; background:rgba(13,16,22,.62);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.35); z-index:10; }
  #panel { top:16px; left:16px; padding:14px 16px; width:286px; }
  #panel h1 { font-size:17px; font-weight:700; letter-spacing:.4px; display:flex; align-items:center; gap:8px; }
  #panel h1 .dot { width:9px; height:9px; border-radius:50%; background:#ffb84d; box-shadow:0 0 10px #ffb84d; }
  #panel .sub { font-size:11px; color:#9aa6b8; margin-top:3px; }
  .row { margin-top:13px; }
  .row label { font-size:12px; color:#cfd6e2; display:flex; justify-content:space-between; margin-bottom:6px; }
  .row label span { color:#ffd28a; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; appearance:none; -webkit-appearance:none; height:4px; border-radius:3px;
    background:linear-gradient(90deg,#ff9a3c,#ffd28a); outline:none; }
  input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:#fff; border:2px solid #ff9a3c; cursor:pointer; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  button { cursor:pointer; font-size:12px; color:#eef1f6; background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:6px 10px; transition:.15s; }
  button:hover { background:rgba(255,255,255,.2); }
  button.on { background:rgba(255,154,60,.28); border-color:rgba(255,154,60,.55); }
  #hud { right:16px; bottom:16px; padding:10px 14px; font-size:12px; line-height:1.9; min-width:150px;
    font-variant-numeric:tabular-nums; }
  #hud b { color:#ffd28a; font-weight:600; float:right; margin-left:14px; }
  #hint { left:16px; bottom:16px; padding:10px 14px; font-size:12px; color:#cfd6e2; line-height:2; }
  kbd { background:rgba(255,255,255,.12); border-radius:4px; padding:1px 6px; font-size:11px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:#0b0e13; color:#e8ecf3; z-index:99; transition:opacity .6s; }
  .spin { width:34px; height:34px; border:3px solid rgba(255,255,255,.15); border-top-color:#ff9a3c;
    border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .fade { opacity:0; pointer-events:none; }
  @media (max-width:680px){ #hint { display:none; } #panel { width:236px; } }
</style>
<noscript><div style="color:#fff;padding:20px">需要启用 JavaScript 才能运行该 3D 场景。</div></noscript>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.160.0.module.js",
    "three/addons/": "../vendor/three-0.160.0-addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="panel" class="card">
  <h1><span class="dot"></span>鹈鹕骑行记 · Pelican on a Bike</h1>
  <div class="sub">Three.js 全程序化场景 · 蹬踏 / 压弯 / 跟随</div>
  <div class="row">
    <label>骑行速度 <span id="spdLabel">11.0 km/h</span></label>
    <input id="speed" type="range" min="0" max="25" step="0.5" value="11">
  </div>
  <div class="btns">
    <button id="btnPause">暂停</button>
    <button id="btnCam" class="on">跟随视角</button>
    <button id="btnBell">鸣铃</button>
    <button id="btnSquawk">鸣叫</button>
    <button id="btnFlap">扑翼</button>
    <button id="btnReset">重置视角</button>
  </div>
</div>

<div id="hud" class="card">
  速度<b id="hSpd">11.0 km/h</b><br>
  里程<b id="hDist">0 m</b><br>
  踏频<b id="hCad">0 rpm</b><br>
  档位<b id="hGear">3/7</b>
</div>

<div id="hint" class="card">
  鼠标拖拽旋转 · 滚轮缩放 · 点击鹈鹕互动<br>
  <kbd>W</kbd>/<kbd>↑</kbd> 加速 · <kbd>S</kbd>/<kbd>↓</kbd> 减速 · <kbd>空格</kbd> 暂停<br>
  <kbd>B</kbd> 车铃 · <kbd>F</kbd> 扑翼 · <kbd>C</kbd> 切换视角 · <kbd>R</kbd> 重置
</div>

<div id="loading"><div class="spin"></div><div>正在装配鹈鹕与自行车…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 工具 ================= */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(90210);
function stdMat(color,rough,metal,extra){return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:rough,metalness:metal},extra||{}));}
function link(mat,a,b,r,seg){
  const d=new THREE.Vector3().subVectors(b,a);const len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||12),mat);
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  m.castShadow=true;return m;
}
function sph(r,mat,seg){return new THREE.Mesh(new THREE.SphereGeometry(r,seg||18,seg||14),mat);}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z||0);

/* ================= 渲染器 ================= */
const app=document.getElementById('app');
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); }
catch(e){ document.getElementById('loading').innerHTML='<div>当前浏览器不支持 WebGL，无法运行该 3D 场景。</div>'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xcfe3ef,95,300);

// 程序化环境光照探针（提升金属/车漆质感）
try{
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
}catch(e){}

const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,0.1,1400);
camera.position.set(63,5.2,0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.07;
controls.minDistance=2.5;controls.maxDistance=40;
controls.maxPolarAngle=Math.PI*0.495;controls.enablePan=false;
controls.enabled=false;

/* ================= 天空 ================= */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(700,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{topC:{value:new THREE.Color(0x2f7fd0)},midC:{value:new THREE.Color(0xa5d4ef)},botC:{value:new THREE.Color(0xe9f4f7)}},
  vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'varying vec3 vP; uniform vec3 topC; uniform vec3 midC; uniform vec3 botC; void main(){ float h=normalize(vP).y; vec3 c= h>0.10 ? mix(midC,topC,smoothstep(0.10,0.80,h)) : mix(botC,midC,smoothstep(-0.28,0.10,h)); gl_FragColor=vec4(c,1.0); #include <tonemapping_fragment> #include <colorspace_fragment> }'
})));

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x547d3c,0.5));
const sun=new THREE.DirectionalLight(0xfff0d6,2.6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=140;
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;
sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;
sun.shadow.bias=-0.00035;sun.shadow.normalBias=0.02;
const sunOffset=V3(-16,26,11);
scene.add(sun);scene.add(sun.target);

/* ================= 环境世界 ================= */
const R=55;
const world=new THREE.Group();scene.add(world);

// 草地
const ground=new THREE.Mesh(new THREE.CircleGeometry(320,72),stdMat(0x6fa04b,0.95,0));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);
for(let i=0;i<26;i++){
  const a=rnd()*Math.PI*2,rr=70+rnd()*180;
  const p=new THREE.Mesh(new THREE.CircleGeometry(4+rnd()*9,18),new THREE.MeshStandardMaterial({color:0x5e8c3f,roughness:1,transparent:true,opacity:.5}));
  p.rotation.x=-Math.PI/2;p.position.set(Math.cos(a)*rr,0.012,Math.sin(a)*rr);world.add(p);
}

// 环形公路（压扁的圆环，表面与地面齐平）
{
  const g=new THREE.TorusGeometry(R,3.6,10,128);g.scale(1,1,0.012);
  const road=new THREE.Mesh(g,stdMat(0x3b3f45,0.92,0.03));
  road.rotation.x=-Math.PI/2;road.position.y=-0.028;road.receiveShadow=true;world.add(road);
  // 中央虚线
  for(let i=0;i<64;i++){
    const a=i/80*Math.PI*2;
    const d=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.006,0.14),stdMat(0xf5f0e2,0.8,0));
    d.position.set(Math.cos(a)*R,0.022,Math.sin(a)*R);d.rotation.y=-a+Math.PI/2;world.add(d);
  }
  // 白色边线（扁平圆环）
  [[R+3.32],[R-3.32]].forEach(function(e){
    const ring=new THREE.Mesh(new THREE.RingGeometry(e[0]-0.07,e[0]+0.07,160),stdMat(0xefeadf,0.7,0));
    ring.rotation.x=-Math.PI/2;ring.position.y=0.024;world.add(ring);
  });
}

// 树
function makeTree(type){
  const g=new THREE.Group();
  const trunkMat=stdMat(0x7a5230,0.9,0);
  const h=2.6+rnd()*2.2;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.26+rnd()*0.1,h,10),trunkMat);
  tr.position.y=h/2;g.add(tr);
  if(type===0){
    const m=stdMat(0x4a8a3c+Math.floor(rnd()*0x001104),0.95,0);
    for(let i=0;i<3;i++){
      const c=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1+rnd()*0.75,0),m);
      c.position.set((rnd()-0.5)*1.1,h+0.7+i*0.62,(rnd()-0.5)*1.1);
      c.g.add(c);
    }
  }else if(type===1){
    const m=stdMat(0x3f7a45,0.95,0);
    for(let i=0;i<3;i++){
      const c=new THREE.Mesh(new THREE.ConeGeometry(1.5-i*0.36,1.8,8),m);
      c.position.y=h+0.7+i*1.0;c.g.add(c);
    }
  }else{
    const m=stdMat(0xe9e6da,0.8,0);
    const tr2=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,h+1.2,8),m);
    tr2.position.y=(h+1.2)/2;g.add(tr2);
    const m2=stdMat(0x9cc45f,0.9,0);
    for(let i=0;i<4;i++){
      const c=new THREE.Mesh(new THREE.IcosahedronGeometry(0.8+rnd()*0.55,0),m2);
      c.position.set((rnd()-0.5)*1.5,h+1.3+i*0.5,(rnd()-0.5)*1.5);c.g.add(c);
    }
  }
  return g;
}
for(let i=0;i<64;i++){
  const a=rnd()*Math.PI*2, rr=(rnd()<0.45? 12+rnd()*36 : 61+rnd()*150);
  const px=Math.cos(a)*rr,pz=Math.sin(a)*rr;
  if(Math.hypot(px-pondC.x,pz-pondC.z)<15.5)continue;
  if(Math.hypot(px-24,pz-26)<10)continue;
  const t=makeTree(Math.floor(rnd()*3));
  t.position.set(px,0,pz);
  t.rotation.y=rnd()*6.28;
  const s=0.75+rnd()*0.8;t.scale.set(s,s,s);
  world.add(t);
}

// 灌木 / 花
const bushMat=stdMat(0x4f8f41,0.95,0);
for(let i=0;i<40;i++){
  const a=rnd()*6.283,rr=(rnd()<0.5?14+rnd()*34:61+rnd()*110);
  const b=new THREE.Group();
  for(let k=0;k<3;k++){
    const c=new THREE.Mesh(new THREE.IcosahedronGeometry(0.45+rnd()*0.4,0),bushMat);
    c.position.set((rnd()-0.5)*0.9,0.4+k*0.22,(rnd()-0.5)*0.9);b.add(c);
  }
  b.position.set(Math.cos(a)*rr,0,Math.sin(a)*rr);world.add(b);
}
{
  const N=240;
  const stemGeo=new THREE.CylinderGeometry(0.014,0.014,0.22,5);stemGeo.translate(0,0.11,0);
  const stems=new THREE.InstancedMesh(stemGeo,stdMat(0x5d8a3a,1,0),N);
  const heads=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,7,6),stdMat(0xfdf6e8,0.6,0),N);
  const dummy=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const a=rnd()*6.283,rr=(rnd()<0.5?13+rnd()*36:62+rnd()*120);
    dummy.position.set(Math.cos(a)*rr,0,Math.sin(a)*rr);
    dummy.rotation.set(0,rnd()*3,0);
    dummy.scale.set(1,0.7+rnd()*0.8,1);
    dummy.updateMatrix();stems.setMatrixAt(i,dummy.matrix);
    dummy.position.y=0.21*dummy.scale.y;dummy.updateMatrix();heads.setMatrixAt(i,dummy.matrix);
  }
  world.add(stems);world.add(heads);
}

// 池塘
const pondC=V3(-28,0,-22);
{
  const sand=new THREE.Mesh(new THREE.CylinderGeometry(13.6,13.6,0.09,40),stdMat(0xd8c48f,1,0));
  sand.position.set(pondC.x,0.045,pondC.z);world.add(sand);
  const water=new THREE.Mesh(new THREE.CircleGeometry(12.4,40),new THREE.MeshStandardMaterial({color:0x3f86c4,roughness:.12,metalness:.35,transparent:true,opacity:.92}));
  water.rotation.x=-Math.PI/2;water.position.set(pondC.x,0.10,pondC.z);world.add(water);
  const lilyMat=stdMat(0x4d9740,0.7,0);
  for(let i=0;i<9;i++){
    const a=rnd()*6.283,rr=rnd()*11;
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.55+rnd()*0.35,0.55+rnd()*0.35,0.03,14,1),lilyMat);
    p.position.set(pondC.x+Math.cos(a)*rr,0.115,pondC.z+Math.sin(a)*rr);
    world.add(p);
  }
}

// 跳出水面的鱼
const fish=new THREE.Group();
const fBody=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,9),stdMat(0xc7d3dc,0.4,0.45));
fBody.scale.set(1.9,0.85,0.5);fish.add(fBody);
const fTail=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.26,4),stdMat(0xc7d3dc,0.4,0.45));
fTail.rotation.z=Math.PI/2;fTail.scale.z=0.35;fTail.position.x=-0.4;fish.add(fTail);
fish.visible=false;world.add(fish);
const splash=new THREE.Mesh(new THREE.RingGeometry(0.3,0.42,24),new THREE.MeshBasicMaterial({color:0xdff0ff,transparent:true,opacity:0,side:THREE.DoubleSide}));
splash.rotation.x=-Math.PI/2;splash.position.set(pondC.x,0.12,pondC.z);world.add(splash);

// 风车
const mill=new THREE.Group();mill.position.set(24,0,26);world.add(mill);
{
  const tower=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.9,14,14),stdMat(0xe7e2d6,0.85,0));
  tower.position.y=7;tower.castShadow=true;mill.add(tower);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(1.4,1.4,14),stdMat(0xd8443f,0.7,0.05));
  cap.position.y=14.6;mill.add(cap);
  const nac=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,1.6),stdMat(0xd8443f,0.7,0.05));
  nac.position.set(0,14,0.8);mill.add(nac);
  const blades=new THREE.Group();blades.position.set(0,14,1.5);mill.add(blades);
  for(let i=0;i<4;i++){
    const arm=new THREE.Group();arm.rotation.z=i*Math.PI/2;
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.55,6.4,0.07),stdMat(0xf4efe2,0.7,0));
    b.position.y=3.2;b.castShadow=true;arm.add(b);blades.add(arm);
  }
  mill.userData.blades=blades;
}

// 篱笆
(function(){
  const a0=2.4,a1=4.3,n=Math.floor((a1-a0)*R/1.4);
  const postMat=stdMat(0x8a6134,0.85,0);
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.13,1.0,0.13),postMat);
    p.position.set(Math.cos(a)*(R+4.4),0.5,Math.sin(a)*(R+4.4));p.rotation.y=-a;p.castShadow=true;world.add(p);
  }
  [0.55,0.9].forEach(function(h){
    const rail=new THREE.Mesh(new THREE.TorusGeometry(R+4.4,0.035,6,80,a1-a0),stdMat(0x8a6134,0.85,0));
    rail.rotation.x=-Math.PI/2;rail.position.y=h;rail.rotation.z=-(a0+(a1-a0)/2)+Math.PI;world.add(rail);
  });
})();

// 云
const clouds=[];
for(let i=0;i<9;i++){
  const c=new THREE.Group();
  const m=stdMat(0xffffff,1,0);
  for(let k=0;k<5;k++){
    const s=sph(1.6+rnd()*1.5,m,12);s.scale.y=0.62;
    s.position.set((k-2)*2.0+rnd(),rnd()*1.1,rnd()*1.6-0.8);c.add(s);
  }
  c.position.set((rnd()-0.5)*420,34+rnd()*26,(rnd()-0.5)*420);
  c.scale.setScalar(0.9+rnd()*1.3);
  clouds.push(c);world.add(c);
}

// 远处的飞鸟
const skyBirds=[];
for(let i=0;i<3;i++){
  const b=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.5,2.2,6),stdMat(0x3a3f46,0.8,0));
  body.rotation.z=-Math.PI/2;b.add(body);
  const wl=new THREE.Group();
  const w1=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,2.4),stdMat(0x3a3f46,0.8,0));w1.position.z=-1.5;
  wl.add(w1);b.add(wl);
  const wr=new THREE.Group();const w2=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,2.4),stdMat(0x3a3f46,0.8,0));w2.position.z=1.5;
  wr.add(w2);b.add(wr);
  b.userData={wl:wl,wr:wr,r:100+i*28,y:52+i*8,sp:0.10+i*0.02,ph:rnd()*6.28};
  skyBirds.push(b);world.add(b);
}

// 花粉粒子
const pollen=(function(){
  const N=180,pos=new Float32Array(N*3),vel=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a=rnd()*6.283,rr=(R-4)+(rnd()<0.5?-1:1)*(2+rnd()*30);
    pos[i*3]=Math.cos(a)*rr;pos[i*3+1]=rnd()*3.5;pos[i*3+2]=Math.sin(a)*rr;
    vel[i*3]=(rnd()-0.5)*0.05;vel[i*3+1]=0.1+rnd()*0.25;vel[i*3+2]=(rnd()-0.5)*0.05;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff0c0,size:0.09,transparent:true,opacity:.55,depthWrite:false}));
  p.userData.vel=vel;world.add(p);return p;
})();

/* ================= 自行车 ================= */
const WHEEL_R=0.345;
const CRANK_R=0.17;
const BBY=0.27;

function buildWheel(isRear){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.30,0.045,14,44),stdMat(0x191a1d,0.95,0)));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.263,0.014,8,44),stdMat(0xc9ced6,0.3,0.8)));

const LEG={l1:0.50,l2:0.55};
function legAngles(hx,hy,tx,ty){
  const dx=tx-hx,dy=ty-hy;
  const d0=Math.hypot(dx,dy);
  const span=clamp(d0,Math.abs(LEG.l1-LEG.l2)+0.05,LEG.l1+LEG.l2-0.03);
  const s=span/Math.max(d0,1e-6);
  const ex=hx+dx*s,ey=hy+dy*s;
  const d=Math.hypot(ex-hx,ey-hy);
  const alpha=Math.atan2(ey-hy,ex-hx);
  const th=Math.acos(clamp((d*d+LEG.l1*LEG.l1-LEG.l2*LEG.l2)/(2*d*LEG.l1),-1,1));
  const k1x=hx+Math.cos(alpha+th)*LEG.l1;
  const k2x=hx+Math.cos(alpha-th)*LEG.l1;
  const sign=k1x>k2x?1:-1;
  const a1=alpha+sign*th;
  const kx=hx+Math.cos(a1)*LEG.l1,ky=hy+Math.sin(a1)*LEG.l1;
  const a2=Math.atan2(ey-ky,ex-kx);
  return [a1,a2];
}

/* ================= 音频合成 ================= */
let ac=null;
function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function bellSound(){
  const a=audio();if(!a)return;
  const t=a.currentTime;
  [[1568,0.18],[2093,0.13]].forEach(function(cfg,i){
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=cfg[0];
    g.gain.setValueAtTime(0.0001,t+i*0.16);
    g.gain.exponentialRampToValueAtTime(cfg[1],t+i*0.16+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.16+0.55);
    o.connect(g);g.connect(a.destination);
    o.start(t+i*0.16);o.stop(t+i*0.16+0.6);
  });
}
function squawkSound(){
  const a=audio();if(!a)return;
  const t=a.currentTime;
  for(let i=0;i<2;i++){
    const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
    o.type=i?'square':'sawtooth';
    f.type='lowpass';f.frequency.value=1600;
    o.frequency.setValueAtTime(i?520:340,t+i*0.02);
    o.frequency.exponentialRampToValueAtTime(i?300:210,t+i*0.02+0.22);
    g.gain.setValueAtTime(0.0001,t+i*0.02);
    g.gain.exponentialRampToValueAtTime(0.09,t+i*0.02+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.02+0.25);
    o.connect(f);f.connect(g);g.connect(a.destination);
    o.start(t+i*0.02);o.stop(t+i*0.02+0.3);
  }
}

  const k=e.code;
  if(k==='ArrowUp'||k==='KeyW'){ speedKmh=clamp(speedKmh+1,0,25); }
  else if(k==='ArrowDown'||k==='KeyS'){ speedKmh=clamp(speedKmh-1,0,25); }
  else if(k==='Space'){ e.preventDefault(); setPause(!paused); return; }
  else if(k==='KeyB'){ bellSound(); bellT=1; return; }
  else if(k==='KeyF'){ flapT=1; return; }
  else if(k==='KeyC'){ followMode=!followMode; btnCam.classList.toggle('on',followMode); controls.enabled=!followMode; return; }
  else if(k==='KeyR'){ camReset=true; return; }
  else return;
  slider.value=speedKmh; spdLabel.textContent=speedKmh.toFixed(1)+' km/h';
});

// 点击鹈鹕互动
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',function(e){ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup',function(e){
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)return;
  ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  if(ray.intersectObjects([P],true).length)doSquawk();
});

/* ================= 动画 ================= */
const clock=new THREE.Clock();
const bikePos=V3(0,0,-R), lookAt=V3(0,1.25,-R);
const tmpV=V3(), tmpV2=V3(), leftV=V3(), behindV=V3(), sideV=V3();
let hudAcc=0, started=false;

function updateRide(dt){
  const v=speedKmh/3.6;
  trackA+=v/R*dt;
  bikePos.set(R*Math.cos(trackA),0,-R*Math.sin(trackA));
  bikeRig.position.copy(bikePos);
  const dir=tmpV.set(-Math.sin(trackA),0,-Math.cos(trackA)).normalize().clone();
  bikeRig.rotation.y=Math.atan2(dir.x,dir.z);

  // 压弯侧倾
  leftV.set(dir.z,0,-dir.x);
  tmpV2.set(-bikePos.x,0,-bikePos.z);
  const side=leftV.dot(tmpV2)>0?1:-1;
  const leanMag=clamp(v*v/(R*1.1)+Math.max(v,0)*0.005,0,0.42);
  leanRig.rotation.x=-leanMag*side;

  // 低速摇摆 + 前轮转向
  const wob=Math.exp(-Math.max(v,0)*0.8);
  rideRig.rotation.y=Math.sin(T*2.4)*0.030*wob+Math.sin(T*6.1)*0.008;
  rideRig.rotation.z=Math.sin(T*3.1)*0.012*wob;
  bike.userData.steer.rotation.y=side*0.05*wob+Math.sin(T*2.4)*0.012*wob;

  // 车轮 / 曲柄
  wheelRotF-=v/WHEEL_R*dt;
  wheelRotR-=v/WHEEL_R*dt;
  const target=6.9;
  const need=2*Math.PI*v/target;
  const gTarget=clamp(Math.round((need-G1)/GD+1),1,7);
  curGear+=(gTarget-curGear)*Math.min(1,dt*2.5);
  const distPerRev=G1+(curGear-1)*GD;
  const wCrank=2*Math.PI*v/distPerRev;
  cadence=Math.abs(wCrank)*60/(2*Math.PI);
  crankAngle-=wCrank*dt;

  bike.userData.frontWheel.rotation.z=wheelRotF;
  bike.userData.rearWheel.rotation.z=wheelRotR;
  bike.userData.crank.rotation.z=crankAngle;
  bike.userData.pedals[0].rotation.z=-crankAngle;
  bike.userData.pedals[1].rotation.z=-crankAngle;

  dist+=v*dt;
}

function updatePelican(dt){
  const v=speedKmh/3.6;
  const cf=clamp(Math.abs(v)/1.2,0,1);

  // 身体起伏 / 摇摆
  P.position.y=P_POS.y+Math.sin(crankAngle*2+0.7)*0.016*cf+Math.sin(T*1.5)*0.005;
  P.position.x=P_POS.x+Math.sin(crankAngle)*0.012*cf;
  P.rotation.z=0.05+Math.sin(crankAngle*2+1.3)*0.020*cf;

  // 双腿 IK：脚落在脚踏上（局部坐标）
  const legs=P.userData.legs;
  for(let i=0;i<2;i++){
    const ph=i*Math.PI;
    const pa=crankAngle+ph;
    const px=Math.cos(pa)*CRANK_R;
    const py=BBY+Math.sin(pa)*CRANK_R;
    const leg=legs[i];
    const ang=legAngles(leg.hip.position.x,leg.hip.position.y,px-P.position.x,py-P.position.y);
    leg.hip.rotation.z=ang[0]-Math.PI/2;
    leg.knee.rotation.z=ang[1]-ang[0];
  }

  // 翅膀：平衡微动 + 扑翼
  flapT=Math.max(0,flapT-dt*1.6);
  flapPhase+=dt*26*(flapT>0?1:0);
  const flap=flapT*Math.sin(flapPhase)*0.95;
  P.userData.wings.forEach(function(w,i){
    const s=w.side;
    w.group.rotation.x=s*(0.08+0.045*Math.sin(T*2.2+i*1.7))-s*flap;
    w.group.rotation.y=-0.06+0.02*Math.sin(T*1.1+i);
    const open=Math.max(0,flap)*0.35;
    w.prims.forEach(function(p,j){
      p.rotation.z=-0.02+open*0.4*(1-j*0.15);
      p.rotation.x=s*(0.12+open*0.8)*(1-j*0.1);
    });
  });

  // 尾羽
  P.userData.tail.rotation.z=0.06*Math.sin(T*3.4)+0.03*cf*Math.sin(crankAngle*2);
  P.userData.tail.rotation.y=0.07*Math.sin(T*1.3);

  // 颈 + 头
  const head=P.userData.head;
  const dip=flapT*0.05;
  const n0=V3(0.16,0.14,0);
  const n2=V3(head.position.x,head.position.y-0.06,0);
  const n1=V3(0.09,0.62+n0.y*0.3,0);
  const sphs=P.userData.neckSph;
  for(let i=0;i<sphs.length;i++){
    const t=i/(sphs.length-1);
    const a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
    sphs[i].position.set(n0.x*a+n1.x*b+n2.x*c,n0.y*a+n1.y*b+n2.y*c,0);
    const r=0.082-0.022*t+dip*0.4*t;
    sphs[i].scale.set(r,r,r*0.98);
  }

  // 头 stabilization
  squawkT=Math.max(0,squawkT-dt*1.4);
  head.rotation.x=-leanRig.rotation.x*0.5-P.rotation.z*0.4+Math.sin(T*1.7)*0.04+flapT*0.18;
  head.rotation.y=Math.sin(T*0.7)*0.05+rideRig.rotation.y*0.4;
  head.rotation.z=-0.05*Math.sin(T*2.2);
  head.position.y=0.62-dip;

  // 张嘴 / 眨眼
  P.userData.lower.rotation.z=clamp(squawkT,0,1)*0.34;
  blinkNext-=dt;
  if(blinkNext<=0){ blk=true; blkT=0; blinkNext=2+rnd()*3.5; }
  if(blk){ blkT+=dt; if(blkT>0.13)blk=false; }
  const bs=blk?0.12:1;
  P.userData.eyes.forEach(function(e){ e.scale.set(1,bs*(1+squawkT*0.25),1); });

  // 车铃 / 筐中鱼 / 飘带
  bellT=Math.max(0,bellT-dt*4);
  bike.userData.bell.scale.set(1,1-Math.sin(bellT*Math.PI)*0.18,1);
  bike.userData.fishTail.rotation.y=Math.sin(T*5)*0.35;
  const st=bike.userData.streamers.children;
  for(let i=0;i<st.length;i++){
    st[i].rotation.z=Math.sin(T*7+i*0.8)*(0.10+0.08*v/10);
    st[i].rotation.x=-0.15-i*0.08+Math.cos(T*6+i)*(0.12+0.05*v/5);
  }
}

function updateEnv(dt){
  const t=Math.max(dt,1e-5);
  clouds.forEach(function(c){ c.position.x+=dt*1.2; if(c.position.x>240)c.position.x=-240; });
  mill.userData.blades.rotation.z+=t*0.5;
  skyBirds.forEach(function(b){
    b.userData.ph+=dt*b.userData.sp;
    b.position.set(Math.cos(b.userData.ph)*b.userData.r,b.userData.y,Math.sin(b.userData.ph)*b.userData.r);
    b.rotation.y=-b.userData.ph;
    const fl=Math.sin(T*9)*0.5;
    b.userData.wl.rotation.z=-fl;b.userData.wr.rotation.z=fl;
  });
  // 鱼跃
  if(fishT<0){
    fishNext-=dt;
    if(fishNext<=0){
      const a=rnd()*6.283,rr=rnd()*9;
      fishP0.set(pondC.x+Math.cos(a)*rr,0.12,pondC.z+Math.sin(a)*rr);
      fishT=0;fishDur=0.9;fishNext=6+rnd()*5;fish.visible=true;
    }
  }else{
    fishT+=dt/fishDur;
    if(fishT>=1.35){ fishT=-1;fish.visible=false;splashT=0; }
    else if(fishT<=1){
      fish.position.set(fishP0.x,0.12+Math.sin(fishT*Math.PI)*2.4,fishP0.z);
      fish.rotation.z=-0.6+fishT*1.2;
    }
  }
  if(splashT>=0){
    splashT+=dt;
    const s=0.4+splashT*3;
    splash.scale.set(s,s,s);
    splash.material.opacity=Math.max(0,0.7-splashT*0.9);
    if(splashT>0.8)splashT=-1;
  }
  // 花粉
  const pos=pollen.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    let x=pos.getX(i)+pollen.userData.vel[i*3]*dt*8;
    let y=pos.getY(i)+pollen.userData.vel[i*3+1]*dt;
    let z=pos.getZ(i)+pollen.userData.vel[i*3+2]*dt*8;
    if(y>5){ y=0;const a=rnd()*6.283,rr=(R-4)+(rnd()<0.5?-1:1)*(2+rnd()*30);x=Math.cos(a)*rr;z=Math.sin(a)*rr; }
    pos.setXYZ(i,x,y,z);
  }
  pos.needsUpdate=true;
  // 太阳与阴影跟随
  sun.position.set(bikePos.x+sunOffset.x,sunOffset.y,bikePos.z+sunOffset.z);
  sun.target.position.copy(bikePos);
}

function updateCamera(dt){
  lookAt.copy(bikePos);lookAt.y+=1.25;
  if(followMode){
    const d=6.2+speedKmh*0.07;
    behindV.set(-Math.sin(trackA),0,-Math.cos(trackA)).multiplyScalar(d);
    sideV.set(-Math.cos(trackA),0,Math.sin(trackA)).multiplyScalar(1.5);
    tmpV.copy(bikePos).add(behindV).add(sideV);tmpV.y=2.85;
    camera.position.lerp(tmpV,1-Math.exp(-dt*3.4));
    controls.target.lerp(lookAt,1-Math.exp(-dt*5));
    camera.lookAt(controls.target);
  }else{
    controls.target.lerp(lookAt,1-Math.exp(-dt*4));
    if(camReset){ camReset=false; camera.position.set(bikePos.x+7,4.5,bikePos.z+6); }
  }
  controls.update();
}

function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt;
  if(!paused){ updateRide(dt); updatePelican(dt); }
  updateEnv(paused?0.0001:dt);
  updateCamera(dt);

  hudAcc+=dt;
  if(hudAcc>0.18){ hudAcc=0;
    document.getElementById('hSpd').textContent=speedKmh.toFixed(1)+' km/h';
    document.getElementById('hDist').textContent=dist<1000?dist.toFixed(0)+' m':(dist/1000).toFixed(2)+' km';
    document.getElementById('hCad').textContent=cadence.toFixed(0)+' rpm';
    document.getElementById('hGear').textContent=Math.round(curGear)+'/7';
  }
  started=true;
  renderer.render(scene,camera);
}

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(tick);

const loading=document.getElementById('loading');
setTimeout(function(){ loading.classList.add('fade'); setTimeout(function(){loading.style.display='none';},700); },400);
setTimeout(function(){
  if(!started){loading.style.display='flex';loading.innerHTML='<div style="text-align:center;max-width:440px;line-height:1.8">Three.js 资源加载失败或 WebGL 不可用。<br>请检查网络（需访问 cdn.jsdelivr.net）后刷新页面。</div>';
  loading.classList.remove('fade');}
},15000);
</script>
