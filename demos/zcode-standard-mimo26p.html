<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鹈鹕骑行 · Pelican Rides a Bicycle</title>
<style>
  :root{
    --glass: rgba(16,20,28,.52);
    --glass-hi: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.16);
    --txt: #eef2f7;
    --dim: #aab6c4;
    --acc: #ffc857;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0c1016; color:var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select:none; }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; width:100%; height:100%; }

  .hidden{ display:none !important; }

  /* ── 标题 ─────────────────────────────── */
  #hud{ position:fixed; top:18px; left:20px; z-index:10; pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.45); }
  .brand-title{ font-size:22px; font-weight:700; letter-spacing:.14em; }
  .brand-sub{ margin-top:3px; font-size:11.5px; letter-spacing:.08em; color:var(--dim); }

  /* ── 控制面板 ─────────────────────────── */
  #panel{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:12;
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    background:var(--glass); border:1px solid var(--line); border-radius:999px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:0 10px 34px rgba(0,0,0,.38), inset 0 1px 0 var(--glass-hi);
    max-width:calc(100vw - 24px); flex-wrap:wrap; justify-content:center; }
  .grp{ display:flex; align-items:center; gap:8px; }
  .lbl{ font-size:11px; letter-spacing:.12em; color:var(--dim); }
  .val{ font-size:12px; font-variant-numeric:tabular-nums; color:var(--acc); min-width:34px; text-align:right; }
  .sep{ width:1px; height:20px; background:var(--line); }
  .pill{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.06);
    color:var(--txt); font-size:12.5px; letter-spacing:.05em; padding:6px 13px; border-radius:999px;
    cursor:pointer; transition:.18s; font-family:inherit; }
  .pill:hover{ background:rgba(255,255,255,.14); }
  .pill.active{ background:linear-gradient(180deg, rgba(255,200,87,.32), rgba(255,200,87,.16));
    border-color:rgba(255,200,87,.55); color:#ffe9bd; }
  input[type=range]{ appearance:none; width:108px; height:4px; border-radius:4px;
    background:rgba(255,255,255,.20); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--acc); border:2px solid rgba(0,0,0,.35); box-shadow:0 1px 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb{ width:15px; height:15px; border-radius:50%;
    background:var(--acc); border:2px solid rgba(0,0,0,.35); }

  /* ── 提示条 ───────────────────────────── */
  #hint{ position:fixed; left:20px; bottom:22px; z-index:11; font-size:11.5px; color:var(--dim);
    background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:8px 15px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow:0 6px 20px rgba(0,0,0,.3); transition:opacity .8s; max-width:44vw; }

  /* ── 启动遮罩 ─────────────────────────── */
  #boot{ position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 35%, #17202e, #0a0d13); transition:opacity .7s; }
  #boot.fade{ opacity:0; pointer-events:none; }
  #boot.gone{ display:none !important; }
  .card{ text-align:center; padding:34px 44px; border-radius:22px; border:1px solid var(--line);
    background:rgba(255,255,255,.04); box-shadow:0 18px 60px rgba(0,0,0,.5); max-width:min(560px, 92vw); }
  .b-title{ font-size:30px; font-weight:700; letter-spacing:.22em; }
  .b-sub{ margin-top:8px; font-size:12.5px; letter-spacing:.10em; color:var(--dim); }
  .spin{ width:34px; height:34px; margin:22px auto 6px; border-radius:50%;
    border:3px solid rgba(255,255,255,.14); border-top-color:var(--acc); animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #bootLog{ margin:12px auto 0; max-width:520px; text-align:left; white-space:pre-wrap; word-break:break-all;
    font-size:11px; line-height:1.55; color:#f3c6c6; font-family:ui-monospace, Consolas, monospace; }
  #bootLog:empty{ display:none; }
  #bootStatus{ margin-top:14px; font-size:12px; color:var(--dim); letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hidden">
  <div class="brand-title">鹈鹕骑行</div>
  <div class="brand-sub">PELICAN RIDES A BICYCLE · 全程序化 Three.js</div>
</div>

<div id="panel" class="hidden">
  <div class="grp">
    <span class="lbl">镜头</span>
    <button data-cam="chase" class="pill active">追逐</button>
    <button data-cam="orbit" class="pill">环绕</button>
    <button data-cam="cine" class="pill">电影</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <span class="lbl">速度</span>
    <input id="speedSlider" type="range" min="0" max="25" step="1" value="15" />
    <span id="speedVal" class="val">15 km/h</span>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <span class="lbl">时段</span>
    <input id="timeSlider" type="range" min="0" max="100" step="1" value="45" />
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btnBell" class="pill">铃铛</button>
    <button id="btnFish" class="pill active">小鱼</button>
    <button id="btnSound" class="pill active">声音</button>
  </div>
</div>

<div id="hint" class="hidden">拖拽环绕 · 滚轮缩放 · W/S 调速 · A/D 转向 · C 切镜头 · 空格按铃 · 点击鹈鹕互动</div>

<div id="boot">
  <div class="card">
    <div class="b-title">鹈鹕骑行</div>
    <div class="b-sub">PELICAN RIDES A BICYCLE</div>
    <div class="spin"></div>
    <div id="bootStatus">正在加载 Three.js …</div>
    <pre id="bootLog"></pre>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   0. 启动引导
   优先同目录 three.module.js（可离线），否则依次尝试多个 CDN。
   ═══════════════════════════════════════════════════════════════ */
const THREE_URLS = [
  '../vendor/three-0.160.0.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.170.0/build/three.module.js',
  'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js',
  'https://esm.sh/three@0.160.0'
];
// 经典脚本（UMD）兜底：本地文件与 CDN 皆可在 file:// 下加载
const THREE_UMD_URLS = [
  './three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js',
  'https://unpkg.com/three@0.159.0/build/three.min.js'
];

const bootEl = document.getElementById('boot');
const bootLog = document.getElementById('bootLog');
const bootStatus = document.getElementById('bootStatus');

function bootFail(msg){
  bootStatus.textContent = '启动失败';
  bootLog.textContent = msg + '\n\n离线方案：把 three.module.js（新版还需 three.core.js）或 three.min.js\n放在本 HTML 同目录后刷新即可；本地模块在 file:// 下可能被 CORS 拦截，\n届时用任意本地服务器打开（如 python -m http.server）。';
  const sp = document.querySelector('.spin'); if (sp) sp.style.display = 'none';
}
window.addEventListener('error', e => {
  bootLog.textContent = '运行错误：' + e.message + '\n@ ' + (e.filename || '?') + ':' + (e.lineno || '?');
});
window.addEventListener('unhandledrejection', e => {
  bootLog.textContent = 'Promise 错误：' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});

async function loadTHREE(){
  const errs = [];
  for (const url of THREE_URLS){
    try {
      bootStatus.textContent = '正在加载 Three.js … ' + url.replace(/^https?:\/\//, '').slice(0, 42);
      const mod = await import(/* @vite-ignore */ url);
      if (mod && mod.Scene) return mod;
      errs.push(url + ' → 导出异常');
    } catch (err){
      errs.push(url + ' → ' + (err && err.message ? err.message : String(err)));
    }
  }
  // 模块导入全部失败 → 用经典 <script>（UMD）兜底（file:// 下同样可加载）
  for (const url of THREE_UMD_URLS){
    try {
      bootStatus.textContent = '正在加载 Three.js（UMD）… ' + url.replace(/^https?:\/\//, '').slice(0, 42);
      const g = await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => resolve(window.THREE);
        s.onerror = () => reject(new Error('脚本加载失败'));
        document.head.appendChild(s);
      });
      if (g && g.Scene) return g;
      errs.push(url + ' → UMD 导出异常');
    } catch (err){
      errs.push(url + ' → ' + (err && err.message ? err.message : String(err)));
    }
  }
  throw new Error('全部来源均失败：\n' + errs.join('\n'));
}

/* ═══════════════════════════════════════════════════════════════
   1. 数学与通用工具
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, lambda, dt) => lerp(cur, target, 1 - Math.exp(-lambda * dt));
const rand = (r, a, b) => a + (b - a) * r();

// 确定性伪随机：场景每次加载布局一致
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── 放样器：由一系列截面(环)生成蒙皮几何 ───────────────────────
   支持超椭圆截面（2=椭圆，越大越方）、平行传输坐标系、
   每顶点形变回调（用于喙的脊、喉囊下垂等有机造型）。
   sections: [{ p:[x,y,z], w, h, pow?, deform?(v,u,theta) }]     */
function makeLoft(THREE, sections, opts){
  opts = opts || {};
  const radial = opts.radial || 18;
  const capStart = opts.capStart !== false;
  const capEnd = opts.capEnd !== false;
  const n = sections.length;
  const P = sections.map(s => new THREE.Vector3(s.p[0], s.p[1], s.p[2]));

  // 切线
  const T = [];
  for (let i = 0; i < n; i++){
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    const t = new THREE.Vector3().subVectors(b, a);
    if (t.lengthSq() < 1e-12) t.set(0, 1, 0);
    T.push(t.normalize());
  }
  // 平行传输法向
  const N = [], B = [];
  const helper = Math.abs(T[0].y) < 0.92 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  let nrm = new THREE.Vector3().crossVectors(helper, T[0]).normalize();
  for (let i = 0; i < n; i++){
    if (i > 0){
      nrm = nrm.clone().addScaledVector(T[i], -nrm.dot(T[i]));
      if (nrm.lengthSq() < 1e-8) nrm = new THREE.Vector3().crossVectors(Math.abs(T[i].y) < 0.92 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0), T[i]);
      nrm.normalize();
    }
    N.push(nrm.clone());
    B.push(new THREE.Vector3().crossVectors(T[i], nrm).normalize());
  }

  const pos = [];
  const idx = [];
  const ring = []; // 每环顶点索引
  for (let i = 0; i < n; i++){
    const s = sections[i];
    const pow = s.pow || 2;
    const e = 2 / pow;
    const ringIdx = [];
    for (let j = 0; j < radial; j++){
      const th = (j / radial) * TAU;
      const c = Math.cos(th), si = Math.sin(th);
      const ex = Math.sign(c) * Math.pow(Math.abs(c), e) * s.w;
      const ey = Math.sign(si) * Math.pow(Math.abs(si), e) * s.h;
      const v = P[i].clone().addScaledVector(N[i], ex).addScaledVector(B[i], ey);
      if (s.deform) s.deform(v, n === 1 ? 0 : i / (n - 1), th);
      ringIdx.push(pos.length / 3);
      pos.push(v.x, v.y, v.z);
    }
    ring.push(ringIdx);
  }
  for (let i = 0; i < n - 1; i++){
    for (let j = 0; j < radial; j++){
      const j2 = (j + 1) % radial;
      const a = ring[i][j], b = ring[i][j2], c = ring[i + 1][j2], d = ring[i + 1][j];
      idx.push(a, b, c, a, c, d);
    }
  }
  const capFan = (ringIdx, section, flip) => {
    const cx = pos[ringIdx[0] * 3], cy = pos[ringIdx[0] * 3 + 1], cz = pos[ringIdx[0] * 3 + 2];
    let mx = 0, my = 0, mz = 0;
    for (const id of ringIdx){ mx += pos[id * 3]; my += pos[id * 3 + 1]; mz += pos[id * 3 + 2]; }
    mx /= ringIdx.length; my /= ringIdx.length; mz /= ringIdx.length;
    const m = (mx + cx) / 2, mk = (my + cy) / 2, mm = (mz + cz) / 2; // 轻微圆顶
    const center = pos.length / 3;
    pos.push(section && section.capOffset ? mx + section.capOffset[0] : m,
             section && section.capOffset ? my + section.capOffset[1] : mk,
             section && section.capOffset ? mz + section.capOffset[2] : mm);
    for (let j = 0; j < ringIdx.length; j++){
      const a = ringIdx[j], b = ringIdx[(j + 1) % ringIdx.length];
      if (flip) idx.push(center, b, a); else idx.push(center, a, b);
    }
  };
  if (capStart) capFan(ring[0], sections[0], true);
  if (capEnd) capFan(ring[n - 1], sections[n - 1], false);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* 锥形圆管：沿折线/曲线采样，半径 r0→r1 线性过渡 */
function taperTube(THREE, points, r0, r1, opts){
  opts = opts || {};
  const n = opts.sections || 12;
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const secs = [];
  for (let i = 0; i < n; i++){
    const u = i / (n - 1);
    const p = curve.getPoint(u);
    secs.push({ p: [p.x, p.y, p.z], w: lerp(r0, r1, u), h: lerp(r0, r1, u), pow: 2 });
  }
  return makeLoft(THREE, secs, { radial: opts.radial || 10, capStart: opts.capStart, capEnd: opts.capEnd });
}

/* 单位骨：沿 +Y 长度 1 的锥形骨，配 orientBone 使用 */
function unitBoneGeo(THREE, r0, r1, radial){
  return makeLoft(THREE, [
    { p: [0, 0, 0], w: r0, h: r0, pow: 2 },
    { p: [0, 0.5, 0], w: lerp(r0, r1, 0.5) * 1.05, h: lerp(r0, r1, 0.5) * 1.05, pow: 2 },
    { p: [0, 1, 0], w: r1, h: r1, pow: 2 }
  ], { radial: radial || 9 });
}

/* 把沿 +Y 的单位骨摆放于 a→b */
function orientBone(THREE, mesh, a, b, thick){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = Math.max(1e-4, d.length());
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  mesh.scale.set(thick || 1, len, thick || 1);
}

/* 两段骨 IK：返回关节（膝/肘）与末端；pole 为关节弯曲朝向 */
function ik2(THREE, root, target, pole, L1, L2){
  const toT = new THREE.Vector3().subVectors(target, root);
  const reach = toT.length();
  const dMin = Math.abs(L1 - L2) + 1e-3;
  const dMax = (L1 + L2) * 0.999;
  const d = clamp(reach, dMin, dMax);
  const dir = reach > 1e-6 ? toT.clone().multiplyScalar(1 / reach) : new THREE.Vector3(0, -1, 0);
  const a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const bend = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (bend.lengthSq() < 1e-8){
    bend.set(0, 0, 1).addScaledVector(dir, -dir.z);
    if (bend.lengthSq() < 1e-8) bend.set(1, 0, 0);
  }
  bend.normalize();
  const joint = root.clone().addScaledVector(dir, a).addScaledVector(bend, h);
  const end = root.clone().addScaledVector(dir, d);
  return { joint, end, reach, d };
}

/* 顶点渐变上色（用于天空穹顶等） */
function paintGradient(THREE, geo, stops){
  // stops: [{t, color}]  t 按包围盒高度归一化
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cA = new THREE.Color(), cB = new THREE.Color(), cC = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const y = pos.getY(i);
    const u = clamp((y - bb.min.y) / Math.max(1e-6, bb.max.y - bb.min.y), 0, 1);
    let s = 0;
    while (s < stops.length - 2 && u > stops[s + 1].t) s++;
    const a = stops[s], b = stops[s + 1];
    const k = clamp((u - a.t) / Math.max(1e-6, b.t - a.t), 0, 1);
    cA.set(a.color); cB.set(b.color); cC.copy(cA).lerp(cB, k);
    col[i * 3] = cC.r; col[i * 3 + 1] = cC.g; col[i * 3 + 2] = cC.b;
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
}

/* 顶点噪声位移（有机感的树冠、岩石、沙丘） */
function displaceNoise(THREE, geo, amp, freq, rnd){
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    const s = Math.sin(v.x * freq + 1.7) * Math.cos(v.y * freq * 1.3 + 0.4) * Math.sin(v.z * freq * 0.8 + 2.1);
    const s2 = Math.sin(v.x * freq * 2.7 + v.z * freq * 1.9) * 0.4;
    const k = 1 + (s + s2) * amp;
    pos.setXYZ(i, v.x * k, v.y * k, v.z * k);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ═══════════════════════════════════════════════════════════════
   2. 材质库（全部程序化，无贴图 / 无 2D 画布）
   ═══════════════════════════════════════════════════════════════ */
function makeMaterials(THREE){
  const std = (color, rough, metal, extra) => new THREE.MeshStandardMaterial(Object.assign({
    color: new THREE.Color(color), roughness: rough, metalness: metal
  }, extra || {}));
  return {
    feather:      std(0xf4efe4, 0.72, 0.0),
    featherWarm:  std(0xe9dcc3, 0.75, 0.0),
    featherDark:  std(0x2b2b33, 0.6, 0.0),
    beakTop:      std(0xf0c469, 0.42, 0.05),
    beakTip:      std(0xe08a45, 0.4, 0.05),
    pouch:        std(0xe08a5a, 0.5, 0.0),
    leg:          std(0xd9975f, 0.55, 0.0),
    foot:         std(0xcf8f58, 0.55, 0.0),
    eye:          std(0x151218, 0.18, 0.1),
    eyeRing:      std(0xd8c6ae, 0.6, 0.0),
    fish:         std(0x9fb6c9, 0.35, 0.25),

    frame:        std(0xb3382c, 0.28, 0.45),
    frameAccent:  std(0xe8dcc4, 0.35, 0.2),
    chrome:       std(0xd6dae0, 0.18, 0.95),
    steel:        std(0x9aa1ab, 0.35, 0.85),
    tire:         std(0x26262c, 0.9, 0.0),
    tireCream:    std(0xded3bd, 0.85, 0.0),
    leather:      std(0x6b4a33, 0.6, 0.05),
    rubberGrip:   std(0x3c2f28, 0.8, 0.0),
    chain:        std(0x838994, 0.3, 0.9),

    grass:        std(0x69954a, 0.95, 0.0),
    leafA:        std(0x5d8f3e, 0.85, 0.0, { flatShading: true }),
    leafB:        std(0x74a848, 0.85, 0.0, { flatShading: true }),
    leafDark:     std(0x3f6f33, 0.85, 0.0, { flatShading: true }),
    bark:         std(0x7a5b41, 0.9, 0.0, { flatShading: true }),
    barkPalm:     std(0x9a7a52, 0.9, 0.0, { flatShading: true }),

    rock:         std(0x8b8377, 0.95, 0.0, { flatShading: true }),
