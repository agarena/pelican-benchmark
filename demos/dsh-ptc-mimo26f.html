<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🦜 鹈鹕骑单车 · Pelican on a Bicycle (Three.js)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1226;font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  .panel{position:fixed;z-index:10;color:#eef4ff;background:rgba(9,14,28,.55);
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.45);transition:opacity .35s, transform .35s}

  #titleCard{top:18px;left:18px;padding:14px 20px}
  #titleCard h1{margin:0;font-size:22px;letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd98a,#8ad4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #titleCard p{margin:6px 0 0;font-size:12px;color:#a9bbe0}

  #stats{top:18px;right:18px;padding:12px 16px;display:flex;gap:14px}
  .stat{display:flex;flex-direction:column;align-items:center;min-width:54px}
  .stat span{font-size:11px;color:#9db1d8}
  .stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;font-size:10px;color:#7d90b8;min-height:12px}

  #ctrl{left:18px;bottom:18px;padding:14px;display:flex;flex-direction:column;gap:10px;
    max-width:min(600px,calc(100vw - 36px))}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{appearance:none;border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    color:#eaf2ff;font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;
    transition:.18s;user-select:none;font-family:inherit;white-space:nowrap;outline:none}
  .btn:hover{background:linear-gradient(180deg,rgba(140,200,255,.35),rgba(80,140,255,.15));transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.on{border-color:rgba(127,208,255,.5);box-shadow:inset 0 0 0 1px rgba(127,208,255,.28),0 0 14px rgba(120,200,255,.22)}
  .slide{gap:10px;font-size:12px;color:#a9bbe0}
  .slide input[type=range]{flex:1;min-width:150px;accent-color:#6ec1ff;height:4px}

  #hints{right:18px;bottom:18px;padding:10px 14px;font-size:11.5px;color:#b9c8ea;
    max-width:44vw;line-height:1.75}
  #btnUI{position:fixed;z-index:12;right:18px;top:112px;width:44px;height:40px;
    border-radius:12px;border:1px solid rgba(255,255,255,.16);cursor:pointer;
    background:rgba(9,14,28,.55);backdrop-filter:blur(14px);color:#eaf2ff;font-size:17px;transition:.2s}
  #btnUI:hover{background:rgba(40,60,110,.7)}

  #toast{position:fixed;z-index:20;left:50%;top:74px;transform:translate(-50%,-8px);
    padding:9px 18px;border-radius:999px;font-size:14px;color:#fff;
    background:rgba(10,18,38,.72);border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:.3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  body.noUI .panel{opacity:0;pointer-events:none;transform:translateY(8px)}

  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#16264a,#070c1a 70%);
    color:#cfe0ff;transition:opacity .6s}
  #loader.gone{opacity:0;pointer-events:none}
  .spin{width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,255,255,.15);
    border-top-color:#6ec1ff;animation:spin .9s linear infinite}
  #loader p{margin:0;font-size:14px;letter-spacing:1px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:760px){
    #titleCard h1{font-size:17px}
    #titleCard p{display:none}
    #hints{display:none}
    #stats{padding:8px 10px;gap:8px}
    .stat b{font-size:15px}
    .btn{font-size:12px;padding:7px 9px}
    #ctrl{left:10px;right:10px;bottom:10px;max-width:none}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel" id="titleCard">
  <h1>🦜 鹈鹕骑单车</h1>
  <p>Pelican on a Bicycle · 全程序化 Three.js 交互场景（无模型 / 无 SVG / 无 2D Canvas）</p>
</div>

<div class="panel" id="stats">
  <div class="stat"><span>速度</span><b id="stSpeed">22.3</b><i>km/h</i></div>
  <div class="stat"><span>里程</span><b id="stDist">0</b><i>m</i></div>
  <div class="stat"><span>帧率</span><b id="stFps">60</b><i>fps</i></div>
  <div class="stat"><span>镜头</span><b id="stCam" style="font-size:14px">跟随</b><i id="stTri">–</i></div>
</div>

<div class="panel" id="ctrl">
  <div class="row">
    <button class="btn" id="btnPause">⏸ 暂停</button>
    <button class="btn" id="btnSlow">🐢 减速</button>
    <button class="btn" id="btnFast">🐇 加速</button>
    <button class="btn" id="btnHonk">📣 鸣叫</button>
  </div>
  <div class="row">
    <button class="btn" id="btnCam">🎥 镜头：跟随</button>
    <button class="btn" id="btnLight">☀️ 白天</button>
    <button class="btn" id="btnFlap">🪽 拍翅膀</button>
    <button class="btn" id="btnSound">🔊 声音：开</button>
  </div>
  <div class="row slide">
    <label for="rngSpeed">骑行速度</label>
    <input type="range" id="rngSpeed" min="0" max="14" step="0.1" value="6.2">
  </div>
  <div class="row">
    <button class="btn hold" id="btnLeanL">◀ 左倾</button>
    <button class="btn hold" id="btnLeanR">右倾 ▶</button>
    <button class="btn" id="btnReset">🎯 重置视角</button>
  </div>
</div>

<div class="panel" id="hints">
  拖拽 = 环视 · 滚轮/双指 = 缩放 · 双击 = 复位 · 点击鹈鹕 = 鸣叫<br>
  空格 暂停 · ↑↓ 调速 · ←→ 倾斜压弯 · C 换镜头 · L 换光照 · H 鸣叫 · F 拍翅 · P 隐藏界面
</div>

<button id="btnUI" title="隐藏/显示界面 (P)">🙈</button>
<div id="toast"></div>
<div id="diag"></div>
<style>
  #diag{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:60;display:none;
    font:11px/1.6 Consolas,monospace;color:#9fe8c6;background:rgba(0,10,6,.78);
    padding:6px 12px;border-radius:8px;max-width:92vw;word-break:break-all;
    border:1px solid rgba(120,255,190,.25)}
</style>

<div id="loader"><div class="spin"></div><p>正在孵化 3D 场景…</p></div>

<script>
  window.__bootTimer = setTimeout(function(){
    if(!window.__sceneReady){
      var el = document.getElementById('loader');
      if(el) el.querySelector('p').textContent = '加载缓慢或失败：本页需要联网访问 cdn.jsdelivr.net 获取 Three.js';
    }
  }, 12000);
  window.__errCount = 0;
  window.__consoleErr = 0;
  (function(){
    var ce = console.error;
    console.error = function(){
      window.__consoleErr++;
      try{ ce.apply(console, arguments); }catch(_){}
    };
  })();
  window.addEventListener('error', function(e){
    window.__errCount++;
    if(window.__sceneReady) return;
    var el = document.getElementById('loader');
    if(el && e.message) el.querySelector('p').textContent = '加载出错：' + e.message;
  });
</script>

<script type="module">
import * as THREE from 'three';

/* ================= 工具 ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const damp  = (a,b,l,dt) => lerp(a,b,1-Math.exp(-l*dt));
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const YAX = V3(0,1,0);
const tmpD = V3();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260226);
const rr = (a,b) => a+(b-a)*rnd();

/* ================= 渲染基础 ================= */
let renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'}); }
catch(e){ $('loader').querySelector('p').textContent = '无法创建 WebGL 上下文：'+e.message; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd2e9ff, 45, 175);
const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 900);
camera.position.set(-3.1, 2.1, 1.3);
const camLook = V3(-0.05, 1.15, 0);

/* ================= 天空 / 太阳 / 星星 ================= */
const skyUniforms = {
  topColor: {value:new THREE.Color(0x3d7fd4)},
  botColor: {value:new THREE.Color(0xd2e9ff)},
  exponent: {value:0.72}
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite:false,
  vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:
    'uniform vec3 topColor; uniform vec3 botColor; uniform float exponent; varying vec3 vP;\n' +
    'void main(){ float h = normalize(vP).y; float m = pow(clamp(h,0.0,1.0), exponent);\n' +
    '  gl_FragColor = vec4(mix(botColor, topColor, m), 1.0);\n' +
    '  #include <tonemapping_fragment>\n' +
    '  #include <colorspace_fragment>\n' +
    '}'
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(380, 32, 18), skyMat);
skyMesh.renderOrder = -10;
scene.add(skyMesh);

const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(6, 20, 16),
  new THREE.MeshBasicMaterial({color:0xfff6d0, fog:false, toneMapped:false}));
scene.add(sunDisc);
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(15, 20, 16),
  new THREE.MeshBasicMaterial({color:0xffe9a8, transparent:true, opacity:0.35,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false, toneMapped:false}));
scene.add(sunGlow);

const starCount = 170;
const starMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0, fog:false, toneMapped:false});
const stars = new THREE.InstancedMesh(new THREE.SphereGeometry(0.55, 6, 5), starMat, starCount);
{
  const d = new THREE.Object3D();
  for(let i=0;i<starCount;i++){
    const th = rr(0, Math.PI*2), ph = rr(0.02, 1.25), R = 320;
    d.position.set(R*Math.sin(ph)*Math.cos(th), R*Math.cos(ph)+20, R*Math.sin(ph)*Math.sin(th));
    d.scale.setScalar(rr(0.5,1.8));
    d.updateMatrix(); stars.setMatrixAt(i, d.matrix);
  }
  stars.instanceMatrix.needsUpdate = true;
}
scene.add(stars);

/* ================= 灯光 ================= */
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x54703f, 0.7); scene.add(hemi);
const amb  = new THREE.AmbientLight(0xffffff, 0.28); scene.add(amb);
const sun  = new THREE.DirectionalLight(0xfff3d8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-7; sun.shadow.camera.right=7;
sun.shadow.camera.top=7; sun.shadow.camera.bottom=-7;
sun.shadow.camera.near=1; sun.shadow.camera.far=48;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.target.position.set(0,1,0);
scene.add(sun, sun.target);

/* ================= 环境反射（程序化 PMREM） ================= */
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, envDirty = true;
function buildEnv(){
  const s = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ c1:{value:palCur.top.clone()}, c2:{value:palCur.bot.clone()} },
    vertexShader:'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform vec3 c1; uniform vec3 c2; varying float h; void main(){ gl_FragColor = vec4(mix(c2,c1,clamp(h,0.0,1.0)),1.0); }'
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(50, 24, 16), m); s.add(dome);
  const sm = new THREE.Mesh(new THREE.SphereGeometry(5, 12, 10),
    new THREE.MeshBasicMaterial({color: palCur.sunC.clone()}));
  sm.position.copy(palCur.sunDir).normalize().multiplyScalar(35); s.add(sm);
  const gnd = new THREE.Mesh(new THREE.CircleGeometry(55, 24),
    new THREE.MeshBasicMaterial({color:0x27402a, side:THREE.DoubleSide}));
  gnd.rotation.x = -Math.PI/2; gnd.position.y = -7; s.add(gnd);
  if(envRT) envRT.dispose();
  envRT = pmrem.fromScene(s, 0.03);
  scene.environment = envRT.texture;
  dome.geometry.dispose(); m.dispose(); sm.geometry.dispose(); sm.material.dispose();
  gnd.geometry.dispose(); gnd.material.dispose();
}

/* ================= 光照模式（白天/黄昏/夜晚） ================= */
const PALETTES = [
  {name:'☀️ 白天', top:0x3d7fd4, bot:0xd2e9ff, fog:0xd2e9ff, sunDir:[9,12,7],   sunI:2.6,  sunC:0xfff3d8, hemiI:0.7,  ambI:0.28, stars:0,   lamp:0, discC:0xfff6d0, discS:1.0},
  {name:'🌇 黄昏', top:0x2b3f74, bot:0xff9d5c, fog:0xf5a878, sunDir:[-13,3.2,8],sunI:1.9,  sunC:0xff9a52, hemiI:0.42, ambI:0.22, stars:0.3, lamp:1, discC:0xffca7a, discS:1.25},
  {name:'🌙 夜晚', top:0x040a1e, bot:0x1a3363, fog:0x132846, sunDir:[7,10,-6],  sunI:0.55, sunC:0xa8c0ff, hemiI:0.2,  ambI:0.14, stars:1,   lamp:1, discC:0xdfe9ff, discS:0.6}
];
function palObj(p){
  return {top:new THREE.Color(p.top), bot:new THREE.Color(p.bot), fog:new THREE.Color(p.fog),
    sunDir:new THREE.Vector3().fromArray(p.sunDir), sunI:p.sunI, sunC:new THREE.Color(p.sunC),
    hemiI:p.hemiI, ambI:p.ambI, stars:p.stars, lamp:p.lamp,
    discC:new THREE.Color(p.discC), discS:p.discS};
}
function palSnap(p){
  return {top:p.top.clone(), bot:p.bot.clone(), fog:p.fog.clone(), sunDir:p.sunDir.clone(),
    sunI:p.sunI, sunC:p.sunC.clone(), hemiI:p.hemiI, ambI:p.ambI, stars:p.stars, lamp:p.lamp,
    discC:p.discC.clone(), discS:p.discS};
}
function palMix(o,a,b,k){
  o.top.lerpColors(a.top,b.top,k); o.bot.lerpColors(a.bot,b.bot,k); o.fog.lerpColors(a.fog,b.fog,k);
  o.sunDir.lerpVectors(a.sunDir,b.sunDir,k); o.sunI=lerp(a.sunI,b.sunI,k);
  o.sunC.lerpColors(a.sunC,b.sunC,k); o.hemiI=lerp(a.hemiI,b.hemiI,k); o.ambI=lerp(a.ambI,b.ambI,k);
  o.stars=lerp(a.stars,b.stars,k); o.lamp=lerp(a.lamp,b.lamp,k);
  o.discC.lerpColors(a.discC,b.discC,k); o.discS=lerp(a.discS,b.discS,k);
}
let lightIdx = 0;
let palCur = palObj(PALETTES[0]), palFrom = palSnap(palCur), palTo = palSnap(palCur), palT = 1;
function setLight(i){
  lightIdx = (i+PALETTES.length)%PALETTES.length;
  palFrom = palSnap(palCur); palTo = palSnap(palObj(PALETTES[lightIdx])); palT = 0;
  envDirty = true;
  $('btnLight').textContent = PALETTES[lightIdx].name;
  toast(PALETTES[lightIdx].name);
}
function applyPalette(dt){
  if(palT < 1){ palT = Math.min(1, palT + dt/1.4); const k = palT*palT*(3-2*palT); palMix(palCur, palFrom, palTo, k); }
  skyUniforms.topColor.value.copy(palCur.top);
  skyUniforms.botColor.value.copy(palCur.bot);
  scene.fog.color.copy(palCur.fog);
  sun.color.copy(palCur.sunC); sun.intensity = palCur.sunI;
  sun.position.copy(palCur.sunDir).normalize().multiplyScalar(17).add(sun.target.position);
  hemi.intensity = palCur.hemiI; amb.intensity = palCur.ambI;
  starMat.opacity = palCur.stars; stars.visible = palCur.stars > 0.01;
  sunDisc.material.color.copy(palCur.discC);
  sunDisc.position.copy(palCur.sunDir).normalize().multiplyScalar(275);
  sunDisc.scale.setScalar(palCur.discS);
  sunGlow.position.copy(sunDisc.position);
  sunGlow.scale.setScalar(palCur.discS);
  sunGlow.material.color.copy(palCur.discC);
  if(envDirty && palT >= 1){ buildEnv(); envDirty = false; }
}
buildEnv();

/* ================= 通用网格工具 ================= */
function mkMesh(geo, mat, cast=true, receive=false){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = receive;
  return m;
}
function segUnit(r0, r1, mat, radial=10){
  const g = new THREE.CylinderGeometry(r1, r0, 1, radial);
  g.translate(0, 0.5, 0);
  return mkMesh(g, mat);
}
const aimQ = new THREE.Quaternion();
function aim(o, a, b){
  o.position.copy(a);
  tmpD.subVectors(b, a);
  const L = tmpD.length() || 1e-5;
  tmpD.divideScalar(L);
  aimQ.setFromUnitVectors(YAX, tmpD);
  o.quaternion.copy(aimQ);
  o.scale.y = L;
  return o;
}

/* ================= 滚动系统（世界向后移动，车固定在原点） ================= */
let dist = 0;
const scrollables = [];
function addScroll(obj, base, range, factor){
  obj.userData.sBase = base; obj.userData.sRange = range; obj.userData.sFactor = factor;
  scrollables.push(obj);
}
function updateScroll(){
  for(let i=0;i<scrollables.length;i++){
    const o = scrollables[i], u = o.userData, R = u.sRange;
    let x = u.sBase - dist*u.sFactor;
    x = ((x % R) + R) % R - R/2;
    o.position.x = x;
  }
}

/* ================= 地面 / 道路 ================= */
{
  const gGeo = new THREE.PlaneGeometry(760, 760, 90, 90);
  gGeo.rotateX(-Math.PI/2);
  const pos = gGeo.attributes.position;
  const cols = new Float32Array(pos.count*3);
  const cNear = new THREE.Color(0x9cbf63), cFar = new THREE.Color(0x5da04f), cDark = new THREE.Color(0x47884277 & 0xffffff);
  const cB = new THREE.Color(0x4e8f45), tmpC = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const n = 0.5 + 0.32*Math.sin(x*0.11)*Math.cos(z*0.09) + 0.18*Math.sin((x+z)*0.045+1.7);
    const near = clamp(1-(Math.abs(z)-2.4)/7, 0, 1);
    tmpC.copy(cB).lerp(cFar, clamp(n,0,1)*0.7).lerp(cNear, near*0.55);
    cols[i*3]=tmpC.r; cols[i*3+1]=tmpC.g; cols[i*3+2]=tmpC.b;
  }
  gGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const gnd = new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({vertexColors:true}));
  gnd.receiveShadow = true;
  scene.add(gnd);
}
const roadMat  = new THREE.MeshLambertMaterial({color:0x3b4048});
const whiteMat = new THREE.MeshLambertMaterial({color:0xf4f2e6});
const dirtMat  = new THREE.MeshLambertMaterial({color:0x8a7a58});
{
  const road = mkMesh(new THREE.BoxGeometry(760, 0.05, 3.4), roadMat, false, true);
  road.position.y = 0.02; scene.add(road);
  for(const s of [-1,1]){
    const sh = mkMesh(new THREE.BoxGeometry(760, 0.03, 0.5), dirtMat, false, true);
    sh.position.set(0, 0.012, s*1.95); scene.add(sh);
    const line = mkMesh(new THREE.BoxGeometry(760, 0.016, 0.1), whiteMat, false, true);
    line.position.set(0, 0.05, s*1.56); scene.add(line);
  }
  for(let i=0;i<42;i++){
    const d = mkMesh(new THREE.BoxGeometry(1.7, 0.016, 0.13), whiteMat, false, true);
    d.position.y = 0.052;
    scene.add(d); addScroll(d, i*4-84, 168, 1);
  }
}

function makeTree(){
  const g = new THREE.Group();
  const trunk = mkMesh(new THREE.CylinderGeometry(0.09, 0.15, 1.2, 7), matBark);
  trunk.position.y = 0.6; g.add(trunk);
  const m = leafMats[Math.floor(rnd()*leafMats.length)];
  if(rnd() < 0.5){
    for(let i=0;i<3;i++){
      const c = mkMesh(new THREE.ConeGeometry(0.78-i*0.19, 1.05, 8), m);
      c.position.y = 1.2 + i*0.52; g.add(c);
    }
  } else {
    const n = 3 + Math.floor(rnd()*3);
    for(let i=0;i<n;i++){
      const s = mkMesh(new THREE.SphereGeometry(rr(0.4,0.62), 10, 8), m);
      s.position.set(rr(-0.35,0.35), 1.25+rr(0,0.75), rr(-0.3,0.3));
      g.add(s);
    }
  }
  return g;
}

/* 尘土粒子 */
const dust = [];
{
  for(let i=0;i<16;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6),
      new THREE.MeshLambertMaterial({color:0xd8ccb4, transparent:true, opacity:0}));
    m.visible = false; scene.add(m);
    dust.push({m, life:0, max:1, vx:0, vy:0, s0:0.05, s1:0.2});
  }
}
let dustTimer = 0;
function spawnDust(){
  let p = null;
  for(const d of dust){ if(d.life<=0){ p=d; break; } }
  if(!p) return;
  p.life = p.max = rr(0.6, 1.0);
  p.m.position.set(-0.62+rr(-0.06,0.06), 0.05, rr(-0.13,0.13));
  p.vx = -(0.7 + speed*0.16); p.vy = rr(0.12, 0.42);
  p.s0 = rr(0.04,0.07); p.s1 = rr(0.15,0.26);
  p.m.visible = true;
}
function updateDust(dt){
  dustTimer -= dt;
  if(speed > 1 && dustTimer <= 0){ dustTimer = 0.05; spawnDust(); }
  for(const p of dust){
    if(p.life > 0){
      p.life -= dt;
      p.m.position.x += p.vx*dt;
      p.m.position.y += p.vy*dt;
      p.vy = Math.max(0.02, p.vy - dt*0.25);
      const k = clamp(p.life/p.max, 0, 1);
      p.m.scale.setScalar(lerp(p.s1, p.s0, k));
      p.m.material.opacity = 0.42*k;
      if(p.life <= 0){ p.m.visible = false; p.m.material.opacity = 0; }
    }
  }
}

function tube(ax,ay,bx,by,r,mat,radial=10){
  const m = segUnit(r, r, mat, radial);
  aim(m, V3(ax,ay,0), V3(bx,by,0));
  bike.add(m); return m;
}
function tubeZ(ax,ay,az,bx,by,bz,r,mat,radial=8){
  const m = segUnit(r, r, mat, radial);
  aim(m, V3(ax,ay,az), V3(bx,by,bz));
  bike.add(m); return m;
}

function buildWheel(){
  const g = new THREE.Group();
  g.add(mkMesh(new THREE.TorusGeometry(0.315, 0.036, 12, 44), M.tire));
  g.add(mkMesh(new THREE.TorusGeometry(0.266, 0.017, 10, 40), M.chrome));
  const hub = mkMesh(new THREE.CylinderGeometry(0.032,0.032,0.13,12), M.chrome);
  hub.rotation.x = Math.PI/2; g.add(hub);
  const spokeGeo = new THREE.CylinderGeometry(0.004,0.004,0.25,5);
  spokeGeo.translate(0,0.147,0);
  for(let i=0;i<18;i++){
    const sg = new THREE.Group();
    sg.rotation.z = i*Math.PI/9;
    const sp = mkMesh(spokeGeo, M.chrome);
    sp.position.z = (i%2 ? 0.03 : -0.03);
    sg.add(sp); g.add(sg);
  }
  return g;
}

/* ================= 动画状态 ================= */
let speed = 6.2, targetSpeed = 6.2, paused = false;
let crankAngle = 0, wheelAngle = 0, tGlobal = 0;
let leanInput = 0, leanCur = 0, flapMode = false;
let honkT = 0, soundOn = true;
let mouseX = 0, mouseY = 0, parTheta = 0, parPhi = 0;

function ik2(hx, hy, fx, fy, l1, l2){
  let dx = fx-hx, dy = fy-hy;
  let d = Math.hypot(dx,dy);
  const dmax = (l1+l2)*0.998, dmin = Math.abs(l1-l2)+0.002;
  if(d > dmax){ const s = dmax/d; dx*=s; dy*=s; d = dmax; }
  if(d < dmin && d > 1e-6){ const s = dmin/d; dx*=s; dy*=s; d = dmin; }
  const base = Math.atan2(dy,dx);
  const ca = clamp((l1*l1 + d*d - l2*l2)/(2*l1*d), -1, 1);
  const a = Math.acos(ca);
  const a1 = base + a, a2 = base - a;
  const k1x = hx + l1*Math.cos(a1), k1y = hy + l1*Math.sin(a1);
  const k2x = hx + l1*Math.cos(a2), k2y = hy + l1*Math.sin(a2);
  const use1 = k1x >= k2x;   // 膝盖朝前（骑行姿态）
  return use1 ? {kx:k1x, ky:k1y, fx:hx+dx, fy:hy+dy} : {kx:k2x, ky:k2y, fx:hx+dx, fy:hy+dy};
}

const HIP = {x:-0.45, y:0.93};
const SHOULDER = {x:-0.28, y:1.34};
const GRIP = {x:0.46, y:1.00};
const aA=V3(), aB=V3();

function animateRider(dt){
  const bobY = Math.sin(crankAngle*2)*0.013;
  const swayZ = Math.sin(crankAngle)*0.014;
  bodyG.position.set(0, bobY, swayZ);
  bodyG.rotation.z = -0.016*Math.sin(crankAngle*2);

  /* 曲柄 / 车轮 / 踏板 */
  crankG.rotation.z = crankAngle;
  wheelR.rotation.z = wheelAngle;
  wheelF.rotation.z = wheelAngle;
  pedalR.rotation.z = -crankAngle;
  pedalL.rotation.z = -(crankAngle + Math.PI);

  const phiR = crankAngle, phiL = crankAngle + Math.PI;
  const pedR = {x: BB.x + CR*Math.cos(phiR), y: BB.y + CR*Math.sin(phiR), z: 0.155};
  const pedL = {x: BB.x + CR*Math.cos(phiL), y: BB.y + CR*Math.sin(phiL), z:-0.155};

  /* 腿部 IK */
  for(const [leg, ped, side] of [[legR, pedR, 1],[legL, pedL,-1]]){
    const hx = HIP.x, hy = HIP.y + bobY, hz = side*0.13 + swayZ*0.5;
    const ax = ped.x, ay = ped.y + 0.055;
    const r = ik2(hx, hy, ax, ay, 0.48, 0.46);
    aA.set(hx,hy,hz); aB.set(r.kx, r.ky, lerp(hz, ped.z, 0.55));
    aim(leg.thigh, aA, aB);
    aA.set(r.kx, r.ky, lerp(hz, ped.z, 0.55)); aB.set(r.fx, r.fy, ped.z);
    aim(leg.shin, aA, aB);
    leg.hip.position.set(hx,hy,hz);
    leg.knee.position.copy(aA);
    leg.foot.position.set(ped.x, ped.y + 0.031, ped.z);
    leg.foot.rotation.set(0,0, 0.16*Math.sin(phiR*side - 0.9));
  }

  /* 翅膀 */
  for(const [w, side] of [[wingR,1],[wingL,-1]]){
    const sx = SHOULDER.x, sy = SHOULDER.y + bobY, sz = side*0.19 + swayZ;
    let gx, gy, gz;
    if(flapMode){
      const ang = Math.sin(tGlobal*5.2 + (side>0?0:0.5))*0.8;
      const bx = 0.62, by = -0.14;
      gx = sx + bx*Math.cos(ang) - by*Math.sin(ang);
      gy = sy + bx*Math.sin(ang) + by*Math.cos(ang);
      gz = side*(0.26 + 0.12*Math.abs(Math.sin(tGlobal*5.2)));
    } else {
      gx = GRIP.x; gy = GRIP.y + bobY*0.5 + (honkT>0 ? 0.05 : 0); gz = side*0.22 + swayZ;
    }
    const dx = gx-sx, dy = gy-sy;
    const L = Math.hypot(dx,dy) || 1e-5;
    const ux = dx/L, uy = dy/L;
    const ex = (sx+gx)/2 + uy*0.09*(-1)*0;   // 占位（下方统一计算）
    const px = uy, py = -ux;                  // 垂直方向（肘部下垂）
    const exs = (sx+gx)/2 + px*0.09;
    const eys = (sy+gy)/2 + py*0.09;
    const ez = lerp(sz, gz, 0.5);
    w.sh.position.set(sx, sy, sz);
    aA.set(sx,sy,sz); aB.set(exs, eys, ez); aim(w.up, aA, aB);
    w.el.position.set(exs, eys, ez);
    aA.set(exs,eys,ez); aB.set(gx,gy,gz); aim(w.fore, aA, aB);
    w.wrist.position.set(gx,gy,gz);
    w.wrist.quaternion.copy(w.fore.quaternion);
  }

  /* 头部 / 喙动画 */
  const honkP = honkT > 0 ? Math.sin(clamp((1-honkT/0.95),0,1)*Math.PI) : 0;
  const idleOpen = 0.035 + 0.02*Math.sin(tGlobal*2.3);
  const open = Math.max(idleOpen, honkP);
  beakUpper.rotation.z = open*0.55;
  beakLower.rotation.z = -open*0.85;
  const pouch = beakLower.userData.pouch;
  const jig = 1 + 0.035*Math.sin(tGlobal*4.1) + 0.03*Math.abs(Math.sin(crankAngle));
  pouch.scale.set(0.20*(1+0.5*honkP)*jig, 0.105*(1+1.05*honkP)*jig, 0.085*(1+0.6*honkP)*jig);
  headG.rotation.z = 0.05*Math.sin(crankAngle*2 + 0.7) + honkP*0.38;
  headG.rotation.y = 0.1*Math.sin(tGlobal*0.55)*(1-honkP);
  headG.rotation.x = 0.03*Math.sin(tGlobal*0.9)*(1-honkP);

  /* 车身姿态 */
  leanCur = damp(leanCur, leanInput*0.32 + (leanInput===0 ? 0.035*Math.sin(tGlobal*0.7) : 0), 5, dt);
  leanG.rotation.x = leanCur + 0.012*Math.sin(crankAngle);
  steer.rotation.y = -leanCur*0.6 + 0.025*Math.sin(tGlobal*1.2);

  if(honkT > 0) honkT -= dt;
}

/* ================= 相机 ================= */
const CAM_NAMES = ['跟随','侧面','环绕','电影'];
let camMode = 0;
let userTheta = 0, userPhi = 0, zoomF = 1;
let dragging = false, lastUser = -99, lastX = 0, lastY = 0;
const cb = {theta:2.75, phi:1.30, r:3.3, tx:-0.05, ty:1.15, tz:0};
function camBase(mode, time){
  switch(mode){
    case 0: cb.theta=2.75; cb.phi=1.30; cb.r=3.3;  cb.tx=-0.05; cb.ty=1.15; cb.tz=0; break;
    case 1: cb.theta=1.35; cb.phi=1.32; cb.r=3.7;  cb.tx=-0.05; cb.ty=1.10; cb.tz=0; break;
    case 2: cb.theta=2.35; cb.phi=1.18; cb.r=4.2;  cb.tx=-0.10; cb.ty=1.10; cb.tz=0; break;
    default:
      cb.theta = 2.6 + Math.sin(time*0.17)*1.6;
      cb.phi   = 1.15 + Math.sin(time*0.26)*0.30;
      cb.r     = 3.5 + Math.sin(time*0.12)*1.3;
      cb.tx = -0.05; cb.ty = 1.15 + 0.18*Math.sin(time*0.2); cb.tz = 0;
  }
}
const camPos = V3(), camTarget = V3();
function updateCamera(dt){
  camBase(camMode, tGlobal);
  if(camMode !== 2 && !dragging && (tGlobal - lastUser) > 4){
    userTheta = damp(userTheta, 0, 0.9, dt);
    userPhi   = damp(userPhi, 0, 0.9, dt);
  }
  const pT = (camMode !== 2 && !dragging) ? mouseX*0.10 : 0;
  const pP = (camMode !== 2 && !dragging) ? mouseY*0.06 : 0;
  parTheta = damp(parTheta, pT, 4, dt);
  parPhi   = damp(parPhi, pP, 4, dt);
  const th = cb.theta + userTheta + parTheta;
  const ph = clamp(cb.phi + userPhi + parPhi, 0.22, 1.62);
  const r  = cb.r * zoomF;
  camTarget.set(cb.tx, cb.ty, cb.tz);
  const sp = Math.sin(ph);
  camPos.set(
    camTarget.x + r*sp*Math.cos(th),
    camTarget.y + r*Math.cos(ph),
    camTarget.z + r*sp*Math.sin(th)
  );
  camPos.y = Math.max(camPos.y, 0.15);
  camera.position.lerp(camPos, 1-Math.exp(-(dragging?18:5)*dt));
  camLook.lerp(camTarget, 1-Math.exp(-6*dt));
  camera.lookAt(camLook);
  const fovT = 50 + speed*0.55 + (camMode===3 ? 3 : 0);
  if(Math.abs(camera.fov - fovT) > 0.02){
    camera.fov = damp(camera.fov, fovT, 2, dt);
    camera.updateProjectionMatrix();
  }
}
function setCam(i){
  camMode = (i+CAM_NAMES.length)%CAM_NAMES.length;
  userTheta = 0; userPhi = 0; lastUser = tGlobal;
  $('stCam').textContent = CAM_NAMES[camMode];
  $('btnCam').textContent = '🎥 镜头：' + CAM_NAMES[camMode];
  toast('🎥 镜头：' + CAM_NAMES[camMode]);
}
function resetView(){ userTheta = 0; userPhi = 0; zoomF = 1; lastUser = tGlobal; toast('🎯 视角已复位'); }

/* ================= 交互 ================= */
const dom = renderer.domElement;
const pointers = new Map();
let pinchD = 0;
let downPos = null;
dom.addEventListener('pointerdown', (e)=>{
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    downPos = {x:e.clientX, y:e.clientY};
    try{ dom.setPointerCapture(e.pointerId); }catch(_){}
  } else if(pointers.size === 2){
    dragging = false;
    const [a,b] = [...pointers.values()];
    pinchD = Math.hypot(a.x-b.x, a.y-b.y);
  }
  lastUser = tGlobal;
});
window.addEventListener('pointermove', (e)=>{
  mouseX = (e.clientX/window.innerWidth)*2-1;
  mouseY = (e.clientY/window.innerHeight)*2-1;
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchD > 0) zoomF = clamp(zoomF*pinchD/d, 0.4, 2.6);
    pinchD = d; lastUser = tGlobal;
  } else if(dragging && pointers.size === 1){
    userTheta -= (e.clientX-lastX)*0.006;
    userPhi   -= (e.clientY-lastY)*0.006;
    userPhi = clamp(userPhi, -1.4, 1.4);
    lastX = e.clientX; lastY = e.clientY;
    lastUser = tGlobal;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchD = 0;
  if(pointers.size === 0){
    if(dragging && downPos){
      const m = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
      if(m < 6) pickClick(e.clientX, e.clientY);
    }
    dragging = false;
  }
  downPos = null;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
dom.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomF = clamp(zoomF*Math.exp(e.deltaY*0.0011), 0.4, 2.6);
  lastUser = tGlobal;
}, {passive:false});
dom.addEventListener('dblclick', resetView);

const keyState = {left:false, right:false, up:false, down:false};
window.addEventListener('keydown', (e)=>{
  if(e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();

  else if(k === 'arrowup' || k === 'w'){ keyState.up = true; }

  if((k === 'arrowleft' || k === 'a') && keyState.left){ keyState.left = false; if(!keyState.right) leanInput = 0; else leanInput = 1; }
  if((k === 'arrowright' || k === 'd') && keyState.right){ keyState.right = false; if(!keyState.left) leanInput = 0; else leanInput = -1; }
});

/* ================= 声音（程序化鹈鹕叫） ================= */
let actx = null;
function ensureAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function honkSound(){
  if(!soundOn) return;
  const ac = ensureAudio(); if(!ac) return;
  const t0 = ac.currentTime;
  const g = ac.createGain();
  const f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1500; f.Q.value = 1.2;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0+0.04);
  g.gain.setValueAtTime(0.22, t0+0.28);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.55);
  f.connect(g); g.connect(ac.destination);
  const o1 = ac.createOscillator(); o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(640, t0);
  o1.frequency.exponentialRampToValueAtTime(255, t0+0.5);
  const o2 = ac.createOscillator(); o2.type = 'square';
  o2.frequency.setValueAtTime(318, t0);
  o2.frequency.exponentialRampToValueAtTime(142, t0+0.5);
  const g2 = ac.createGain(); g2.gain.value = 0.4;
  o1.connect(f); o2.connect(g2); g2.connect(f);
  o1.start(t0); o2.start(t0);
  o1.stop(t0+0.6); o2.stop(t0+0.6);
}

function updateFX(dt){
  const so = clamp((speed-3)/11, 0, 1)*0.45;
  for(const s of streaks) s.material.opacity = so;
  const lampK = palCur.lamp;
  for(const l of lamps){
    l.light.intensity = lampK*14;
    l.glow.opacity = lampK*0.55;
  }
  lampBulbMat.emissiveIntensity = 0.05 + lampK*3.2;
  M.lens.emissiveIntensity = 0.25 + lampK*2.2;
  if(window.__headLight) window.__headLight.intensity = lampK*7;
  /* 飞鸟扇翅 */
  for(const b of birds){
    for(const w of b.wings) w.m.rotation.x = w.s*Math.sin(tGlobal*7 + b.ph)*0.65;
  }
}

function frame(){
  const dt = Math.min(clock.getDelta(), 0.05);
  tGlobal += dt;

  if(!paused){
    speed = damp(speed, targetSpeed, 3, dt);
    dist += speed*dt;
    wheelAngle -= (speed/R_WHEEL)*dt;
    crankAngle += (speed/R_WHEEL)/GEAR*dt;
    if(keyState.up)   setSpeed(targetSpeed + 6*dt);
    if(keyState.down) setSpeed(targetSpeed - 6*dt);
  }

  updateScroll();
  animateRider(dt);
  updateDust(dt);
  applyPalette(dt);
  updateFX(dt);
  updateCamera(dt);

  fpsAcc += dt; fpsFrames++;
  uiAcc += dt;
  if(uiAcc > 0.25){
    $('stSpeed').textContent = (speed*3.6).toFixed(1);
    $('stDist').textContent = Math.floor(dist);
    $('stFps').textContent = fpsAcc > 0 ? Math.round(fpsFrames/fpsAcc) : 0;
    fpsAcc = 0; fpsFrames = 0; uiAcc = 0;
  }

  renderer.render(scene, camera);

  /* ---- 渲染自检（纯 WebGL 读回，不使用 2D Canvas） ---- */
  if(tGlobal > 2.0 && (!window.__pixNext || tGlobal > window.__pixNext)){
    window.__pixNext = tGlobal + 2;
    try{
      const gl = renderer.getContext();
      const W = renderer.domElement.width, H = renderer.domElement.height;
      const pts = [[W>>1,H>>1],[W>>1,H>>2],[W>>1,(H*3)>>2],[W>>2,H>>1],[(W*3)>>2,H>>1],[W>>1,H-6],[6,H-6],[W-6,H-6]];
      window.__pix = pts.map(p=>{
        const px = new Uint8Array(4);
        gl.readPixels(p[0], p[1], 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        return ((1<<24)|(px[0]<<16)|(px[1]<<8)|px[2]).toString(16).slice(1);
      });
      window.__pixDone = true;
    }catch(e){ window.__pixErr = e.message; }
  }
  if(window.__pixDone && uiAcc === 0){
    try{
      const info = renderer.info.render;
      const box = new THREE.Box3().setFromObject(rig);
      $('stTri').textContent = (info.triangles/1000).toFixed(1) + 'k△';
      $('diag').textContent = JSON.stringify({
        err: window.__errCount||0, cerr: window.__consoleErr||0,
        calls: info.calls, tri: info.triangles,
        pix: window.__pix,
        rigY: [box.min.y.toFixed(2), box.max.y.toFixed(2)],
        rigX: [box.min.x.toFixed(2), box.max.x.toFixed(2)],
        cam: [camera.position.x.toFixed(2), camera.position.y.toFixed(2), camera.position.z.toFixed(2)],
        dist: Math.floor(dist), ready: !!window.__sceneReady
      });
    }catch(e){ $('diag').textContent = JSON.stringify({diagErr: e.message}); }
  }
}
renderer.setAnimationLoop(frame);

/* ================= 尺寸 / 启动 ================= */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__sceneReady = true;
if(/[?&]diag=1/.test(location.search)) $('diag').style.display = 'block';
clearTimeout(window.__bootTimer);
$('loader').classList.add('gone');
setTimeout(()=>{ const l=$('loader'); if(l) l.style.display='none'; }, 700);
setTimeout(()=>toast('🖱️ 拖拽环视 · 点击鹈鹕试一试'), 900);
</script>
</body>
