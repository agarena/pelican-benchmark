<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="description" content="一只骑自行车的鹈鹕 — 全程序化 Three.js 3D 场景"/>
<title>鹈鹕骑士 · Pelican on a Bicycle — Three.js</title>
<style>
  :root{
    --glass: rgba(16, 26, 34, 0.55);
    --stroke: rgba(255,255,255,0.22);
    --txt: #eef6f9;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0; overflow: hidden; background: #0a1a24; color: var(--txt);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene{ position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active{ cursor: grabbing; }
  #vignette{
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 58%, rgba(8, 22, 32, 0.30) 100%);
  }
  /* ---------- 标题 ---------- */
  #title{
    position: fixed; top: 18px; left: 20px; z-index: 10; pointer-events: none;
    text-shadow: 0 2px 14px rgba(6,20,30,.55);
  }
  #title h1{
    margin: 0; font-size: 26px; letter-spacing: .06em; font-weight: 800;
    background: linear-gradient(120deg, #ffffff 30%, #ffd9a0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p{ margin: 4px 0 0; font-size: 12px; opacity: .82; letter-spacing: .12em; }
  #hint{
    position: fixed; top: 20px; right: 20px; z-index: 10; pointer-events: none;
    font-size: 12px; padding: 8px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: .9; letter-spacing: .04em;
  }
  /* ---------- 控制条 ---------- */
  #hud{
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    max-width: min(96vw, 860px);
  }
  .pill{
    display: flex; align-items: center; gap: 4px;
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 999px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 5px; box-shadow: 0 8px 30px rgba(4, 16, 26, .35);
  }
  .pill button{
    appearance: none; border: 0; background: transparent; color: var(--txt);
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    transition: background .16s ease, transform .1s ease; white-space: nowrap;
  }
  .pill button:hover{ background: rgba(255,255,255,0.16); }
  .pill button:active{ transform: scale(.94); }
  .pill button.on{ background: rgba(255, 214, 140, 0.28); color: #ffe9c4; }
  #readout{
    font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 8px; min-width: 148px; text-align: center;
    letter-spacing: .02em; opacity: .95;
  }
  /* ---------- 加载 / 错误 ---------- */
  #loading, #fatal{
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #14314a 0%, #0a1a24 100%);
    transition: opacity .7s ease; text-align: center; padding: 24px;
  }
  #fatal{ display: none; }
  #fatal.show{ display: flex; }
  #loading.hide{ opacity: 0; pointer-events: none; }
  .spinner{
    width: 54px; height: 54px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.15); border-top-color: #7fd6c8;
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loading p, #fatal p{ margin: 0; font-size: 14px; letter-spacing: .1em; opacity: .85; }
  #fatalMsg{ color: #ffb4a8; }
  @media (max-width: 640px){
    #title h1{ font-size: 20px; }
    #hint{ display: none; }
    #readout{ min-width: 120px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<header id="title">
  <h1>🚲 鹈鹕骑士</h1>
  <p>PELICAN ON A BICYCLE · 全程序化 THREE.JS 场景</p>
</header>
<div id="hint">左键旋转 · 滚轮缩放 · 右键平移 · 点击鹈鹕听它叫 · 空格暂停 · 1–4 视角</div>

<div id="hud">
  <div class="pill"><button id="btnPause" title="空格">⏸ 暂停</button></div>
  <div class="pill">
    <button id="btnDown" title="减速">🐢 慢一点</button>
    <span id="readout">0.0 km/h · 55 rpm</span>
    <button id="btnUp" title="加速">快一点 🐇</button>
  </div>
  <div class="pill">
    <button data-cam="free" class="on">自由</button>
    <button data-cam="orbit">环绕</button>
    <button data-cam="side">侧跟</button>
    <button data-cam="top">俯视</button>
  </div>
  <div class="pill"><button id="btnSquawk">📣 让它叫</button><button id="btnMute" title="音效开关">🔊</button></div>
</div>

<div id="loading"><div class="spinner"></div><p id="loadingText">正在加载 Three.js 并唤醒鹈鹕骑士…</p></div>
<div id="fatal"><p>⚠️ 场景无法启动</p><p id="fatalMsg"></p><p style="opacity:.6">请检查网络（需从 CDN 加载 Three.js）后刷新。</p></div>

<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1a24;color:#fff;z-index:99">需要启用 JavaScript 才能运行本场景。</div></noscript>

<script type="text/javascript">
(function(){
'use strict';
/* ============================================================
 * 鹈鹕骑士 · Pelican on a Bicycle
 * 全部内容（鹈鹕、自行车、环境、动画、灯光、交互）程序化生成
 * 仅依赖 Three.js 运行时；无 SVG / 2D Canvas / 外部模型 / 预渲染动画
 * ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var loadingEl = $('loading'), fatalEl = $('fatal'), fatalMsg = $('fatalMsg');

function fatal(msg){
  fatalMsg.textContent = msg;
  fatalEl.classList.add('show');
  loadingEl.classList.add('hide');
}
window.addEventListener('error', function(e){
  if(!window.__threeOk){ fatal('脚本错误: ' + (e.message || e.type)); }
});

/* ---------- 多 CDN 依次尝试加载 Three.js (r147 UMD) ---------- */
var CDNS = [
  '../vendor/three-0.147.0.min.js',
  'https://fastly.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
  'https://unpkg.com/three@0.147.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/r147/three.min.js',
  'https://lib.baomitu.com/three.js/r147/three.min.js'
];
function loadScript(url){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url; s.async = false;
    s.onload = function(){ res(url); };
    s.onerror = function(){ rej(new Error('load fail: ' + url)); };
    document.head.appendChild(s);
  });
}
(async function(){
  for(var i=0;i<CDNS.length;i++){
    try{ await loadScript(CDNS[i]); }catch(e){ /* 尝试下一个 */ }
    if(window.THREE){ window.__threeOk = true; break; }
  }
  if(!window.THREE){
    fatal('无法从 CDN 加载 Three.js（当前网络不可用）。请连接网络后刷新页面。');
    return;
  }
  try{ boot(); }catch(e){ console.error(e); fatal('初始化失败: ' + e.message); }
})();

/* ============================================================ */
function boot(){
const THREE = window.THREE;
var V3 = THREE.Vector3;
var UP = new V3(0,1,0);
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function sstep(a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function rand(a,b){ return a + Math.random()*(b-a); }

/* ---------------- 渲染器 / 场景 / 摄像机 ---------------- */
var canvas = $('scene');
var renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
}catch(e){ fatal('无法创建 WebGL 上下文: ' + e.message); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;

var scene = new THREE.Scene();
var FOGC = new THREE.Color(0xd8ecf3);
scene.fog = new THREE.Fog(FOGC, 28, 135);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 900);
camera.position.set(5.4, 2.6, 4.2);

/* ---------------- 灯光 ---------------- */
var hemi = new THREE.HemisphereLight(0xcfe4ff, 0x9a8a6a, 0.85);
scene.add(hemi);

var sun = new THREE.DirectionalLight(0xfff1da, 1.45);
sun.position.set(8, 12, 5.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2; sun.shadow.camera.far = 42;
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5;  sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.022;
scene.add(sun); scene.add(sun.target);
sun.target.position.set(0, 0.7, 0);

var fill = new THREE.DirectionalLight(0xa9c8ff, 0.38);
fill.position.set(-7, 5, -6);
scene.add(fill);

var rim = new THREE.DirectionalLight(0xffe2bb, 0.30);
rim.position.set(-3, 4, 7);
scene.add(rim);

/* ---------------- 基础工具 ---------------- */
function mkMesh(geo, mat){
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function tubeAB(a, b, r1, r2, mat, seg){
  seg = seg || 12;
  var dir = new V3().subVectors(b, a);
  var len = dir.length();
  var g = new THREE.CylinderGeometry(r1, r2, len, seg);
  g.translate(0, len/2, 0);
  var m = new THREE.Mesh(g, mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function between(a, b, r, mat, seg){ return tubeAB(a, b, r, r, mat, seg); }
function sphObj(r, mat, w, h){
  var m = new THREE.Mesh(new THREE.SphereGeometry(r, w||20, h||14), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function boxObj(w, h, d, mat){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ---------------- 材质 ---------------- */
var M = {
  frame:    new THREE.MeshStandardMaterial({ color: 0x0fa08f, metalness: 0.35, roughness: 0.38 }),
  frameDark:new THREE.MeshStandardMaterial({ color: 0x0b7a6d, metalness: 0.4,  roughness: 0.4 }),
  metal:    new THREE.MeshStandardMaterial({ color: 0xd9dee3, metalness: 0.85, roughness: 0.28 }),
  metalDark:new THREE.MeshStandardMaterial({ color: 0x8f979e, metalness: 0.8,  roughness: 0.4 }),
  tire:     new THREE.MeshStandardMaterial({ color: 0x24262b, metalness: 0.05, roughness: 0.92 }),
  saddle:   new THREE.MeshStandardMaterial({ color: 0x4a3226, metalness: 0.0,  roughness: 0.85 }),
  grip:     new THREE.MeshStandardMaterial({ color: 0x7a5230, metalness: 0.0,  roughness: 0.9 }),
  feather:  new THREE.MeshPhysicalMaterial({ color: 0xf6f4ec, roughness: 0.72, metalness: 0.0,
             sheen: 0.6, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xfff2dc) }),
  featherCream: new THREE.MeshStandardMaterial({ color: 0xfff3dc, roughness: 0.75 }),
  wing:     new THREE.MeshStandardMaterial({ color: 0xeceae2, roughness: 0.72 }),
  wingTip:  new THREE.MeshStandardMaterial({ color: 0xc3c8ce, roughness: 0.7 }),
  beak:     new THREE.MeshStandardMaterial({ color: 0xf0a03c, roughness: 0.42 }),
  beakHook: new THREE.MeshStandardMaterial({ color: 0xd98a2b, roughness: 0.45 }),
  pouch:    new THREE.MeshStandardMaterial({ color: 0xf4b173, roughness: 0.35, transparent: true, opacity: 0.88 }),
  skin:     new THREE.MeshStandardMaterial({ color: 0xe0926a, roughness: 0.55 }),
  legSkin:  new THREE.MeshStandardMaterial({ color: 0xd98a63, roughness: 0.6 }),
  eye:      new THREE.MeshStandardMaterial({ color: 0x191b1f, roughness: 0.25 }),
  glint:    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
  grass:    new THREE.MeshStandardMaterial({ color: 0x71a757, roughness: 1.0 }),
  grassDark:new THREE.MeshStandardMaterial({ color: 0x5f9550, roughness: 1.0 }),
  walk:     new THREE.MeshStandardMaterial({ color: 0xcfc6b0, roughness: 0.95 }),
  curb:     new THREE.MeshStandardMaterial({ color: 0xb9b09c, roughness: 0.95 }),
  trunk:    new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.95 }),
  leaf1:    new THREE.MeshStandardMaterial({ color: 0x5e9e4f, roughness: 0.9, flatShading: true }),
  leaf2:    new THREE.MeshStandardMaterial({ color: 0x4c8a44, roughness: 0.9, flatShading: true }),
  leaf3:    new THREE.MeshStandardMaterial({ color: 0x77ad5b, roughness: 0.9, flatShading: true }),
  pole:     new THREE.MeshStandardMaterial({ color: 0x3c4650, metalness: 0.5, roughness: 0.5 }),
  lampHead: new THREE.MeshStandardMaterial({ color: 0x2e3742, metalness: 0.5, roughness: 0.5 }),
  fence:    new THREE.MeshStandardMaterial({ color: 0xe8e4d8, roughness: 0.9 }),
  cloud:    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 }),
  hill:     new THREE.MeshStandardMaterial({ color: 0x9dba8b, roughness: 1.0, flatShading: true }),
  reed:     new THREE.MeshStandardMaterial({ color: 0x9db56a, roughness: 1.0 }),
  reedHead: new THREE.MeshStandardMaterial({ color: 0x7a6a3a, roughness: 1.0 }),
  hull:     new THREE.MeshStandardMaterial({ color: 0x274a5e, roughness: 0.7 }),
  sail:     new THREE.MeshStandardMaterial({ color: 0xf3ede0, roughness: 0.9, side: THREE.DoubleSide }),
  bird:     new THREE.MeshStandardMaterial({ color: 0x3a4652, roughness: 0.9 }),
  hillFar:  new THREE.MeshStandardMaterial({ color: 0xaec6a4, roughness: 1.0, flatShading: true })
};

/* ---------------- 天空穹顶 / 太阳 ---------------- */
var SUN_DIR = new V3(0.55, 0.55, 0.34).normalize();
var skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR.clone() } },
  vertexShader: [
    'varying vec3 vDir;',
    'void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vDir; uniform vec3 uSun;',
    'void main(){',
    '  vec3 d = normalize(vDir);',
    '  float h = clamp(d.y, -1.0, 1.0);',
    '  vec3 zen = vec3(0.18, 0.45, 0.73);',
    '  vec3 mid = vec3(0.55, 0.76, 0.90);',
    '  vec3 hor = vec3(0.88, 0.94, 0.96);',
    '  vec3 col = mix(mid, zen, smoothstep(0.0, 0.55, h));',
    '  col = mix(hor, col, smoothstep(-0.02, 0.24, h));',
    '  float s = max(dot(d, normalize(uSun)), 0.0);',
    '  col += vec3(1.0, 0.86, 0.62) * pow(s, 900.0) * 1.6;',
    '  col += vec3(1.0, 0.88, 0.68) * pow(s, 22.0) * 0.17;',
    '  col += vec3(1.0, 0.90, 0.74) * pow(s, 4.0) * 0.05;',
    '  col = mix(col, vec3(0.62, 0.71, 0.74), smoothstep(0.0, -0.28, h));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
});
var sky = new THREE.Mesh(new THREE.SphereGeometry(400, 24, 14), skyMat);
sky.renderOrder = -10;
scene.add(sky);

var sunDisc = new THREE.Mesh(new THREE.SphereGeometry(11, 18, 12),
  new THREE.MeshBasicMaterial({ color: 0xfff6dc, fog: false }));
sunDisc.position.copy(SUN_DIR).multiplyScalar(360);
scene.add(sunDisc);

/* ---------------- 地面 / 公路（程序化着色器） ---------------- */
function HASH_GLSL(){
  return [
    'float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
    'float vnoise(vec2 p){',
    '  vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.0-2.0*f);',
    '  float a = h21(i); float b = h21(i+vec2(1.0,0.0));',
    '  float c = h21(i+vec2(0.0,1.0)); float d = h21(i+vec2(1.0,1.0));',
    '  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);',
    '}'
  ].join('\n');
}
var roadUniforms = {
  uScroll: { value: 0 },
  uFog: { value: FOGC.clone() },
  uCam: { value: new V3() }
};
var roadMat = new THREE.ShaderMaterial({
  uniforms: roadUniforms,
  vertexShader: [
    'varying vec2 vUv; varying vec3 vW;',
    'void main(){',
    '  vUv = uv;',
    '  vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec2 vUv; varying vec3 vW;',
    'uniform float uScroll; uniform vec3 uFog; uniform vec3 uCam;',
    HASH_GLSL(),
    'void main(){',
    '  float sx = (vUv.x - 0.5) * 600.0;',
    '  float sz = (0.5 - vUv.y) * 260.0;',
    '  float s = sx + uScroll;',
    '  float az = abs(sz);',
    '  vec3 col;',
    '  if(az < 2.90){',
    '    float n = vnoise(vec2(s*3.0, sz*3.0))*0.55 + vnoise(vec2(s*11.0, sz*11.0))*0.45;',
    '    col = vec3(0.205, 0.212, 0.221) + (n - 0.5) * 0.06;',
    '    float dash = step(fract(s * 0.42), 0.55);',
    '    float cl = step(az, 0.075) * dash;',
    '    col = mix(col, vec3(0.88, 0.87, 0.80), cl * 0.85);',
    '    float edge = step(abs(az - 2.70), 0.05);',
    '    col = mix(col, vec3(0.84, 0.83, 0.76), edge * 0.8);',
    '  } else if(az < 3.55){',
    '    float n = vnoise(vec2(s*6.0, sz*6.0));',
    '    col = vec3(0.57, 0.54, 0.46) + (n - 0.5) * 0.09;',
    '  } else {',
    '    float n = vnoise(vec2(s*1.6, sz*1.6))*0.6 + vnoise(vec2(s*7.0, sz*7.0))*0.4;',
    '    vec3 g1 = vec3(0.335, 0.53, 0.24);',
    '    vec3 g2 = vec3(0.46, 0.66, 0.30);',
    '    col = mix(g1, g2, n);',
    '    float mow = 0.5 + 0.5 * sin(sz * 1.9);',
    '    col *= 0.93 + 0.10 * mow;',
    '    col = mix(col, vec3(0.58, 0.55, 0.46), smoothstep(3.7, 4.3, az) * 0.30);',
    '  }',
    '  float sh = 0.0;',
    '  sh += exp(-(pow((sx + 0.52)/0.30, 2.0) + pow(sz/0.34, 2.0))) * 0.62;',
    '  sh += exp(-(pow((sx - 0.52)/0.30, 2.0) + pow(sz/0.34, 2.0))) * 0.62;',
    '  sh += exp(-(pow((sx + 0.22)/0.78, 2.0) + pow(sz/0.55, 2.0))) * 0.38;',
    '  col *= 1.0 - min(sh, 0.62);',
    '  float d = length(vW - uCam);',
    '  col = mix(col, uFog, smoothstep(28.0, 132.0, d));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
});
var ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 260), roadMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* 真实阴影草地：只在路两侧各放一条窄条（公路由下方案程式化着色） */
var grassL = new THREE.Mesh(new THREE.PlaneGeometry(600, 26), M.grass);
grassL.rotation.x = -Math.PI/2; grassL.position.set(0, 0.004, -17.9);
grassL.receiveShadow = true; scene.add(grassL);
var grassR = new THREE.Mesh(new THREE.PlaneGeometry(600, 26), M.grass);
grassR.rotation.x = -Math.PI/2; grassR.position.set(0, 0.004, 17.9);
grassR.receiveShadow = true; scene.add(grassR);

/* ---------------- 运河水面 ---------------- */
var waterUniforms = {
  uTime: { value: 0 }, uScroll: { value: 0 },
  uFog: { value: FOGC.clone() }, uCam: { value: new V3() }
};
var waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: [
    'varying vec3 vW;',
    'void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vW;',
    'uniform float uTime; uniform float uScroll; uniform vec3 uFog; uniform vec3 uCam;',
    HASH_GLSL(),
    'void main(){',
    '  vec2 p = vec2(vW.x + uScroll * 0.85, vW.z);',
    '  float w1 = sin(p.x * 0.9 + uTime * 0.9) * sin(p.y * 1.7 - uTime * 0.6);',
    '  float w2 = sin(p.x * 2.3 - uTime * 1.4 + sin(p.y * 2.9) * 1.2);',

var cam = {
  tx: 0, ty: 1.0, tz: 0,     /* 目标点（插值后为目标） */
  r: 8.6, tR: 4.0,
  th: 1.62, tTh: 0.95,
  ph: 0.92, tPh: 1.12,
  auto: false
};
function applyCam(){
  var sp = Math.sin(cam.ph), cp = Math.cos(cam.ph);
  camera.position.set(
    cam.tx + cam.r * sp * Math.sin(cam.th),
    cam.ty + cam.r * cp,
    cam.tz + cam.r * sp * Math.cos(cam.th)
  );
  camera.lookAt(cam.tx, cam.ty, cam.tz);
}
function setCam(preset){
  if(preset === 'orbit'){ cam.auto = true;  cam.tR = 4.7; cam.tTh = 0.95; cam.tPh = 1.18; cam.tz = 0; cam.ty = 1.0; cam.tx = 0; }
  else if(preset === 'side'){ cam.auto = false; cam.tR = 4.3; cam.tTh = 0.06; cam.tPh = 1.45; cam.tz = 0; cam.ty = 0.92; cam.tx = 0; }
  else if(preset === 'top'){ cam.auto = false; cam.tR = 4.8; cam.tTh = 0.55; cam.tPh = 0.55; cam.tz = 0; cam.ty = 0.8; cam.tx = 0; }
  else { cam.auto = false; cam.tR = 3.9; cam.tTh = 1.05; cam.tPh = 1.30; cam.tz = 0; cam.ty = 1.0; cam.tx = 0; }
  var btns = document.querySelectorAll('[data-cam]');
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('on', btns[i].getAttribute('data-cam') === preset);
  }
}
setCam('free');

var ptrs = {};
var mode = null, moved = 0, downT = 0, downX = 0, downY = 0, pinchD = 0;
function panCam(dx, dy){
  var right = new V3().setFromMatrixColumn(camera.matrix, 0);
  var up = new V3().setFromMatrixColumn(camera.matrix, 1);
  var s = cam.r * 0.0012;
  cam.tx -= right.x * dx * s; cam.ty += up.y * dy * s; cam.tz -= right.z * dx * s;
  cam.tx = clamp(cam.tx, -3, 3); cam.ty = clamp(cam.ty, 0.1, 3.2); cam.tz = clamp(cam.tz, -3, 3);
}
canvas.addEventListener('pointerdown', function(e){
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  if(Object.keys(ptrs).length === 1){
    mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    moved = 0; downT = performance.now(); downX = e.clientX; downY = e.clientY;
    cam.auto = false;
    var btns = document.querySelectorAll('[data-cam]');
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  } else if(Object.keys(ptrs).length === 2){
    mode = 'pinch';
    var ks = Object.keys(ptrs);
    var a = ptrs[ks[0]], b = ptrs[ks[1]];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
canvas.addEventListener('pointermove', function(e){
  var p = ptrs[e.pointerId];
  if(!p) return;
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if(mode === 'orbit'){
    cam.tTh -= dx * 0.0052;
    cam.tPh = clamp(cam.tPh - dy * 0.0042, 0.30, 1.53);
  } else if(mode === 'pan'){
    panCam(dx, dy);
  } else if(mode === 'pinch' && Object.keys(ptrs).length === 2){
    var ks = Object.keys(ptrs);
    var a = ptrs[ks[0]], b = ptrs[ks[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    if(pinchD > 0) cam.tR = clamp(cam.tR * (pinchD / d), 1.5, 16);
    pinchD = d;
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  if(Object.keys(ptrs).length === 0){
    if(mode !== null && moved < 7 && performance.now() - downT < 450) clickAt(e.clientX, e.clientY);
    mode = null;
  }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; if(!Object.keys(ptrs).length) mode = null; });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  cam.tR = clamp(cam.tR * Math.exp(e.deltaY * 0.0011), 1.5, 16);
}, { passive: false });

/* ---------------- 音效（程序化合成） ---------------- */
var actx = null, muted = false;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function playSquawk(){
  ensureAudio();
  if(!actx || muted) return;
  var t0 = actx.currentTime;
  var osc = actx.createOscillator(); osc.type = 'sawtooth';
  var g = actx.createGain();
  var f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(1600, t0);
  f.frequency.exponentialRampToValueAtTime(480, t0 + 0.38);
  f.Q.value = 2.2;
  osc.frequency.setValueAtTime(700, t0);
  osc.frequency.exponentialRampToValueAtTime(440, t0 + 0.16);
  osc.frequency.exponentialRampToValueAtTime(300, t0 + 0.38);
  var lfo = actx.createOscillator(); lfo.frequency.value = 26;
  var lg = actx.createGain(); lg.gain.value = 16;
  lfo.connect(lg); lg.connect(osc.frequency);
  lfo.start(t0); lfo.stop(t0 + 0.42);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
  osc.connect(f); f.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + 0.44);
}

/* ---------------- 动画 ---------------- */
function solveLeg(hip, footTarget){
  var dir = new V3().subVectors(footTarget, hip);
  var d = dir.length();
  var dmin = Math.abs(L1 - L2) + 0.004, dmax = L1 + L2 - 0.004;
  var dc = clamp(d, dmin, dmax);
  dir.normalize();
  var t = hip.clone().addScaledVector(dir, dc);
  var a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc);
  var h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
  var nx = dir.y, ny = -dir.x;
  if(nx > 0){ nx = -nx; ny = -ny; }
  var kx = hip.x + dir.x * a + nx * h;
  var ky = hip.y + dir.y * a + ny * h;
  var kz = hip.z + (t.z - hip.z) * (a / dc);
  return { knee: new V3(kx, ky, kz), foot: t };
}
function setSeg(mesh, a, b){
  var dir = new V3().subVectors(b, a);
  var len = dir.length();
  mesh.position.copy(a);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.scale.set(1, len, 1);
}
var HIP_S = new V3(-0.02, 0.05, 0.105);
var HIP_N = new V3(-0.02, 0.05, -0.105);
var tmpV = new V3(), tmpV2 = new V3();

function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var dtS = state.paused ? 0 : dt;
  simT += dtS;

  /* 速度模型：踏频 → 车速（带惯性） */
  state.cadence += (state.cadenceTarget - state.cadence) * (1 - Math.exp(-dtS * 4));
  var w = state.cadence / 60 * Math.PI * 2;
  var targetSpeed = w * 0.45;
  state.speed += (targetSpeed - state.speed) * (1 - Math.exp(-dtS * 1.8));

  /* 骑行相位 */
  crankPhase += w * dtS;
  wheelPhase -= (state.speed / WHEEL_R) * dtS;
  scroll += state.speed * dtS;
  chainOff += w * 0.105 * 14 * dtS;

  wheelR.rotation.z = wheelPhase;
  wheelF.rotation.z = wheelPhase;
  crankR.rotation.z = crankPhase;
  crankL.rotation.z = crankPhase + Math.PI;

  /* 地面纹路滚动 */
  roadUniforms.uScroll.value = scroll;
  roadUniforms.uCam.value.copy(camera.position);
  waterUniforms.uScroll.value = scroll * 0.85;
  waterUniforms.uTime.value = simT;
  waterUniforms.uCam.value.copy(camera.position);
  chainMats[0].uniforms.uOff.value = chainOff;
  chainMats[1].uniforms.uOff.value = chainOff;

  /* 车身摆动 / 压弯 */
  var steer = Math.sin(simT * 0.9) * 0.05 + Math.sin(simT * 0.43 + 1.3) * 0.022;
  steering.rotation.z = steer;
  var leanT = -steer * 0.5;
  lean += (leanT - lean) * (1 - Math.exp(-dtS * 8));
  bike.rotation.x = lean;
  bike.position.z = Math.sin(simT * 0.5) * 0.12;
  bike.position.y = Math.sin(crankPhase * 2) * 0.006 + Math.sin(simT * 2.1) * 0.002;

  /* 鹈鹕身体 */
  var bobY = Math.sin(crankPhase * 2) * 0.012 + Math.sin(simT * 1.8) * 0.005;
  pelRoot.position.y = 0.95 + bobY;
  pelRoot.rotation.z = -0.10 + Math.sin(crankPhase * 2 + 0.6) * 0.014 + lean * 0.35;
  pelRoot.rotation.x = lean * 0.35;
  pelRoot.rotation.y = -steer * 0.22;
  pelRoot.updateMatrix();

  /* 呼吸 */
  var br = Math.sin(simT * 1.9) * 0.012;
  body.scale.set(0.30 * (1 + br), 0.33 * (1 - br), 0.27 * (1 + br));

  /* 脖子 & 头 */
  neckG.rotation.z = Math.sin(simT * 0.9 + 0.5) * 0.02;
  lookTimer -= dtS;
  if(lookTimer <= 0){
    lookTimer = rand(2.5, 5.0);
    lookY = rand(-0.5, 0.5);
    lookX = rand(-0.16, 0.22);
  }
  var lk = 1 - Math.exp(-dtS * 3);
  headG.rotation.y += (lookY - headG.rotation.y) * lk;
  headG.rotation.x += (lookX - headG.rotation.x) * lk;
  headG.rotation.z = bobY * 0.8 + Math.sin(simT * 1.4) * 0.012;

  /* 眨眼 */
  if(dtS > 0){
    blinkTimer -= dt;
    if(blinkTimer <= 0){ blinkT = 0.16; blinkTimer = rand(2.2, 5.0); }
    if(blinkT > 0){
      blinkT -= dt;
      var bp = 1 - Math.max(blinkT, 0) / 0.16;
      var bks = 1 - 0.9 * Math.sin(Math.PI * bp);
      eyeL.scale.y = eyeR.scale.y = bks;
    } else {
      eyeL.scale.y = eyeR.scale.y = 1;
    }
  }

  /* 鸣叫 */
  var sqEnv = 0;
  if(sqT >= 0){
    sqT += dt;
    if(sqT > 0.55){ sqT = -1; } else {
      sqEnv = Math.sin(Math.PI * sqT / 0.55);
    }
  }
  mandible.rotation.z = sqEnv * 0.22;
  headG.rotation.x -= sqEnv * 0.20;
  var wingFlapS = sqEnv * 0.30, wingFlapN = -sqEnv * 0.30;

  /* 喉囊弹簧（上下颠簸 + 转向侧倾） */
  var bobVel = (bobY - prevBobY) / Math.max(dt, 0.0001);
  prevBobY = bobY;
  var drive = -bobVel * 0.14 - lean * 1.1 + sqEnv * 5.0;
  pouchVel += (drive - pouchAng * 42 - pouchVel * 7.5) * Math.min(dt, 0.05);
  pouchAng += pouchVel * Math.min(dt, 0.05);
  pouchAng = clamp(pouchAng, -0.35, 0.35);
  pouchG.rotation.z = -0.05 + pouchAng * 0.35;
  pouchG.rotation.x = Math.sin(simT * 1.2) * 0.03 + pouchAng * 0.10;

  /* 腿（IK 跟随脚踏） */
  function pedalPos(phase, z){
    return new V3(-0.17 * Math.sin(phase), 0.27 + 0.17 * Math.cos(phase) + 0.02, z);
  }
  pelRoot.updateMatrix();
  var hipS = HIP_S.clone().applyMatrix4(pelRoot.matrix);
  var hipN = HIP_N.clone().applyMatrix4(pelRoot.matrix);
  var tgtS = pedalPos(crankPhase, 0.107);
  var tgtN = pedalPos(crankPhase + Math.PI, -0.107);

  var sS = solveLeg(hipS, tgtS);
  setSeg(legS.thigh, hipS, sS.knee);
  setSeg(legS.shank, sS.knee, sS.foot);
  pantsS.position.copy(sS.knee).lerp(hipS, 0.38);
  ankS.position.copy(sS.foot); ankS.position.y += 0.045;
  var sN = solveLeg(hipN, tgtN);
  setSeg(legN.thigh, hipN, sN.knee);
  setSeg(legN.shank, sN.knee, sN.foot);
  pantsN.position.copy(sN.knee).lerp(hipN, 0.38);
  ankN.position.copy(sN.foot); ankN.position.y += 0.045;

  /* 脚保持水平 */
  footR.rotation.z = -(crankPhase + lean) - 0.10;
  footL.rotation.z = -(crankPhase + Math.PI + lean) - 0.10;

  /* 尾巴 & 翅膀 */
  tailG.rotation.z = Math.sin(simT * 1.2) * 0.05 + lean * 0.5;
  tailG.rotation.x = Math.sin(simT * 0.8) * 0.04;
  var wsway = Math.sin(simT * 0.7) * 0.045;
  wingS.body.rotation.y = wsway;
  wingN.body.rotation.y = -wsway;
  wingS.body.rotation.z = Math.sin(simT * 0.9) * 0.02;
  wingN.body.rotation.z = Math.sin(simT * 0.9 + 1.0) * 0.02;
  wingS.aim.rotation.z = wingFlapS;
  wingN.aim.rotation.z = wingFlapN;

  /* 车把飘带 */
  var rb, ri;
  for(ri = 0; ri < ribbonR.length; ri++){
    rb = Math.sin(simT * 5.5 + ri * 0.9) * 0.17 + Math.min(state.speed * 0.02, 0.25);
    ribbonR[ri].rotation.z = rb;
    ribbonL[ri].rotation.z = Math.sin(simT * 5.5 + ri * 0.9 + 0.9) * 0.17 - Math.min(state.speed * 0.02, 0.25);
  }

  /* 环境滚动回收 */
  var i, sc, o;
  for(i = 0; i < scrollers.length; i++){
    sc = scrollers[i];
    sc.obj.position.x -= state.speed * sc.parallax * dtS;
    if(sc.obj.position.x < -sc.span / 2) sc.obj.position.x += sc.span;
  }
  /* 帆船漂移 */
  sailboat.position.x -= (state.speed * 0.9 + 0.25) * dtS;
  if(sailboat.position.x < -60) sailboat.position.x = 60;
  sailboat.rotation.z = Math.sin(simT * 0.8) * 0.03;
  /* 飞鸟 */
  for(i = 0; i < birds.length; i++){
    o = birds[i];
    o.x += (o.sp - state.speed * 0.4) * dtS;
    if(o.x > 55) o.x = -55;
    o.g.position.set(o.x, o.y, o.z);
    var fl = Math.sin(simT * 9 + o.ph) * 0.55;
    o.w1.rotation.z = fl; o.w2.rotation.z = -fl;
  }
  /* 速度线 */
  var slOpa = clamp((state.speed - 5.5) / 5, 0, 0.22);
  for(i = 0; i < speedLines.length; i++){
    o = speedLines[i];
    if(slOpa > 0.001){
      o.m.position.set(o.x, o.y + Math.sin(simT * 3 + i) * 0.05, o.z);
      o.m.lookAt(camera.position.x, camera.position.y, camera.position.z);
      o.m.material.opacity = slOpa;
      o.x -= state.speed * 1.4 * dtS;
      if(o.x < -4) o.x = 4;
    } else if(o.m.material.opacity !== 0){
      o.m.material.opacity = 0;
    }
  }

  /* 摄像机 */
  if(cam.auto) cam.tTh += dt * 0.18;
  var k = 1 - Math.exp(-7 * dt);
  cam.r += (cam.tR - cam.r) * k;
  cam.th += (cam.tTh - cam.th) * k;
  cam.ph += (cam.tPh - cam.ph) * k;
  applyCam();

  sky.position.copy(camera.position);
  sunDisc.position.copy(SUN_DIR).multiplyScalar(360).add(camera.position);
  sun.position.set(camera.position.x + 8, 12, camera.position.z + 5.5);
  sun.target.position.set(camera.position.x, 0.7, camera.position.z);

  renderer.render(scene, camera);

  /* 读数（每 ~250ms） */
  readoutAcc += dt;
  if(readoutAcc > 0.25){
    readoutAcc = 0;
    $('readout').textContent = (state.speed * 3.6).toFixed(1) + ' km/h · ' + Math.round(state.cadence) + ' rpm';
  }
  if(!window.__hiddenLoading){
    window.__hiddenLoading = true;
    loadingEl.classList.add('hide');
  }
}
var readoutAcc = 0;
setCam('free');
setCadence(state.cadenceTarget);
animate();

} /* boot */
})();
</script>
</body>
</html>
